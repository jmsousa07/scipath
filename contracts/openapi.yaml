    post:
      tags: [publicacao]
      summary: Publica um material próprio
      description: |-
        Publica um material da conta autenticada (RF012, §8.3). A requisição é
        `multipart/form-data` e traz os metadados e o arquivo na **mesma** requisição: é o que
        torna a ordem do RN008 implementável — o servidor recebe, valida o arquivo, move para o
        storage definitivo e só então grava material e arquivo **numa transação** (ADR-0005 §2).
        Falha no meio não deixa material público incompleto nem arquivo validado servido por
        engano.

        **O autor não é campo.** A autoria vem da sessão — a conta autenticada no servidor —,
        nunca de um campo enviado pelo cliente (RF012, ADR-0003 (j)). Não existe neste schema
        campo de autor, de conta ou de perfil; enviá-lo no corpo é ignorado, porque a propriedade
        não é negociável pelo cliente.

        **Publicar exige conta `ATIVO`** (verificação de e-mail concluída — ADR-0003 (b)): conta
        `PENDENTE_VERIFICACAO` recebe **403** com mensagem que diz o que falta ("confirme seu
        e-mail para publicar"), não um erro genérico. A escrita exige o `X-CSRF-Token`; sem
        sessão a resposta é **401**, e o **403** de CSRF aparece quando há sessão (a autenticação
        precede a checagem de CSRF).

        **Taxonomia por `slug`.** Categoria, tipo de material e licença são enviados pelo `slug`
        estável (ADR-0006) — o mesmo valor que a leitura devolve em `categoria.slug`, `tipo.slug`
        e `licenca.slug` e que os filtros de descoberta aceitam. `slug` bem formado mas
        inexistente (ou inativo) devolve **422** no campo correspondente (RF018); nenhuma licença
        é atribuída automaticamente — o autor escolhe.

        **O arquivo precisa ser PDF válido** (RF013, ADR-0005 §1), conferido por conteúdo, não só
        pela extensão. Formato não aceito — PDF renomeado, MIME mentindo ou `Content-Type` que
        não é `multipart/form-data` — devolve **415**. Arquivo acima do limite configurado
        (`SCIPATH_UPLOAD_MAX_BYTES`, 30 MB por padrão) devolve **413** com a mensagem específica
        ("arquivo acima de X MB"), nunca um 500 genérico (RNF004).

        **`declaracaoDireito` é obrigatório e precisa ser `true`** (RF012): é a confirmação de que
        o autor possui o direito de compartilhar o material. Ausente ou `false` devolve **422** no
        campo. Campo obrigatório ausente no formulário devolve **400** (o servidor não conseguiu
        ler o pedido como veio); campo presente com valor inválido devolve **422**
        `validacao_campo`.

        Sucesso devolve **201** com o `slug` gerado no servidor (único e estável), o `estado`
        inicial (`PUBLICADO`) e a `urlPublica` da página do material (RF012, RF019).
      operationId: publicarMaterial
      security:
        - SessaoCookie: []
      parameters:
        - $ref: '#/components/parameters/TokenCsrf'
      requestBody:
        required: true
        description: |-
          Metadados e arquivo do material na mesma requisição. Não há campo de autor: a autoria
          vem da sessão. `categoriaSlug`, `tipoSlug` e `licencaSlug` são os `slug` estáveis da
          taxonomia (RF018).
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PublicacaoMaterial'
            examples:
              publicacao:
                summary: Publicação válida (o valor de `arquivo` representa o binário do PDF)
                value:
                  titulo: Introdução a algoritmos de ordenação
                  descricao: Nota de aula sobre ordenação por comparação, com análise de complexidade e exemplos em pseudocódigo.
                  categoriaSlug: computacao-e-tecnologia
                  tipoSlug: nota-de-aula
                  licencaSlug: cc-by-4.0
                  declaracaoDireito: true
                  arquivo: (conteúdo binário do PDF)
      responses:
        '201':
          description: |-
            Material publicado e já visível na descoberta (estado `PUBLICADO`, RF019). O `slug` é
            gerado no servidor e é a chave estável da URL pública (RNF025).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialPublicado'
              examples:
                publicado:
                  summary: Material publicado
                  value:
                    slug: introducao-a-algoritmos-de-ordenacao
                    estado: PUBLICADO
                    urlPublica: /materiais/introducao-a-algoritmos-de-ordenacao
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroAcessoNegado'
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'
        '413':
          $ref: '#/components/responses/ErroArquivoMuitoGrande'
        '415':
          $ref: '#/components/responses/ErroTipoNaoSuportado'
        '422':
          $ref: '#/components/responses/ErroValidacaoCampo'
        '500':
          $ref: '#/components/responses/ErroInesperado'

  /materiais/{slug}:
    get:
      tags: [descoberta]
      summary: Detalhe do material público
      description: |
        Devolve o material identificado pelo `slug` público (RF005), com autoria, categoria,
        tipo, licença explicada e estado de publicação.

        Visibilidade: material inexistente, RETIRADO ou EXCLUIDO responde **404** — os três
        de forma indistinguível, para não revelar a existência de material fora do público
        (RN002, CA008). É o mesmo `urn:scipath:erro:nao_encontrado` de qualquer endereço sem
        recurso.

        Transparência: a resposta é o que o autor declarou. Não há marca de revisão,
        certificação, curadoria ou verificação científica (RN010, RN011, CA012).

        Nenhum dado privado (RNF013): fora do schema ficam e-mail, hash de senha, token e
        qualquer identificador de conta.

        SEO (RNF024, RNF025): a rota `/materiais/{slug}` do frontend emite `title` =
        `titulo`, `description` = `descricao` e `canonical` derivado do próprio `slug` — URL
        estável, sem depender de estado do navegador. Dados estruturados só se forem
        corretos (§12.3).

        Acesso ao arquivo (RF014, v0.5): o corpo traz `arquivo` com o que a tela precisa para
        oferecer o download — nome original sanitizado, tamanho em bytes e se está disponível —,
        nunca caminho, chave de storage nem credencial (RNF014). O download em si é
        `GET /materiais/{slug}/arquivo`, decidido no servidor.
      operationId: getMaterial
      parameters:
        - $ref: '#/components/parameters/SlugRecurso'
