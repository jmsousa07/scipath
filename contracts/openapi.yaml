      summary: Autentica e abre a sessão
      description: |
        Login (RF009, CA004). A senha é conferida contra o hash bcrypt 12 da conta.

        **Credenciais inválidas → 401**, com corpo **idêntico** para e-mail inexistente e senha
        errada: o login não serve para descobrir quem tem conta (RNF013). O `detail` não diz qual
        campo falhou.

        Conta `SUSPENSO` com credenciais **corretas** → **403**: quem provou ser o dono tem o
        direito de saber por que não entra (RNF004). Com credenciais erradas, a resposta continua
        sendo o mesmo 401 — a suspensão não se transforma em oráculo de existência.

        Sucesso devolve **200** com o estado da sessão, abre a sessão na cookie do ADR-0003 (e) e
        reemite a sessão anterior, se havia.
      operationId: abrirSessao
