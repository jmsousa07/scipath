  /materiais/{slug}/arquivo:
    get:
      tags: [publicacao]
      summary: Baixa o arquivo de um material público
      description: |-
        Entrega o arquivo PDF do material público identificado pelo `slug` (RF014, §14.4). A
        resposta é o próprio arquivo, com `Content-Disposition: attachment` e o nome original
        sanitizado sugerido para salvar.

        **Visibilidade decidida no servidor.** Material inexistente, RETIRADO, EXCLUIDO ou de
        conta não ATIVA responde **404**, todos de forma **indistinguível** — mesmo status, mesmo
        corpo, sem revelar que o material existe fora do público (RN002, RN003, CA008). É o mesmo
        `urn:scipath:erro:nao_encontrado` de qualquer endereço sem recurso.

        **Nada de infraestrutura na resposta.** O contrato não expõe caminho, chave de storage,
        checksum nem credencial: o arquivo é servido pelo servidor, nunca por endereço direto
        (RF014, RNF014). Divergência de integridade entre o arquivo em disco e o registro do
        `file_asset` faz o servidor **não servir** o arquivo e responder erro (RN008) — o corpo
        do erro não carrega o caminho nem o detalhe interno.

        Não exige sessão: é a leitura pública do arquivo publicado.
      operationId: baixarArquivoMaterial
      parameters:
        - $ref: '#/components/parameters/SlugRecurso'
      responses:
        '200':
          description: Arquivo do material público.
          headers:
            Content-Disposition:
              description: |-
                `attachment` com o nome original sanitizado do arquivo, para o navegador salvar
                em vez de abrir no visualizador embutido.
              schema:
                type: string
              example: attachment; filename="introducao-a-algoritmos-de-ordenacao.pdf"
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'
        '500':
          $ref: '#/components/responses/ErroInesperado'

