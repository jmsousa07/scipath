        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroAcessoNegado'
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'
        '415':
          $ref: '#/components/responses/ErroTipoNaoSuportado'
        '422':
          $ref: '#/components/responses/ErroValidacaoCampo'
        '500':
          $ref: '#/components/responses/ErroInesperado'

  /sessoes/atual:
    get:
      tags: [identidade]
      summary: Estado da sessão corrente
      description: |
        Diz se há sessão e, havendo, quem é (RF009). É a chamada que o frontend faz ao carregar
        para decidir o que mostrar no cabeçalho.

        **Sem sessão a resposta é 200 com `autenticado: false`**, não 401: não estar autenticado
        não é erro, é o estado normal do visitante — e o frontend precisa desse estado sem tratar
        uma falha (RNF004).

        Havendo sessão, devolve o perfil público e o estado da conta. Nunca devolve e-mail de
        login, hash, token nem identificador interno de conta (RNF013) — nem para o dono: a área
        do usuário é construída sem esses dados (§15.2).

        Publicar exige `estadoConta: ATIVO`; navegar, pesquisar e editar o próprio perfil não
        exigem (ADR-0003 (b)).
      operationId: getSessaoAtual
      responses:
        '200':
          description: Estado da sessão — autenticado ou não.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoAtual'
              examples:
                anonima:
                  summary: Visitante sem sessão
                  value:
                    autenticado: false
                autenticada:
                  summary: Usuário autenticado com verificação de e-mail pendente
                  value:
                    autenticado: true
                    estadoConta: PENDENTE_VERIFICACAO
                    perfil:
                      slug: joao-souza
                      nomePublico: João Souza
                      areasInteresse: []
                      linksExternos: []
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'
        '500':
          $ref: '#/components/responses/ErroInesperado'
    delete:
      tags: [identidade]
      summary: Encerra a sessão corrente (logout)
      description: |
        Logout (RF009, CA004). A sessão é invalidada **no servidor**: o cookie reapresentado
        depois do logout não autentica mais nada, mesmo que o cliente guarde o valor.

        É **idempotente**: sem sessão válida também responde **204**. Sair não deve depender de a
        sessão ainda estar viva — um 401 aqui viraria estado de erro em tela por um logout que, na
        prática, já aconteceu (RNF004, §15.3).

        A cookie de sessão é expirada na resposta. A escrita exige o `X-CSRF-Token`.
      operationId: encerrarSessao
      parameters:
        - $ref: '#/components/parameters/TokenCsrf'
      responses:
        '204':
          description: Sessão encerrada; a resposta não tem corpo.
        '403':
          $ref: '#/components/responses/ErroAcessoNegado'
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'
        '500':
          $ref: '#/components/responses/ErroInesperado'

  /perfil/atual:
    put:
      tags: [identidade]
      summary: Edita o perfil público da própria conta
      description: |
        Edição dos campos públicos do próprio perfil (RF011). Substitui o conjunto de campos: o
        que não vier é tratado como não informado, e campo opcional enviado **vazio** é aceito e
        vale como não informado — o requisito pede que opcionais possam ficar vazios, não que
        precisem sair da requisição.

        **A propriedade vem da sessão, nunca do corpo** (ADR-0003 (j), CA007): não existe campo de
        identificador de conta ou de perfil no request, e portanto não há como editar o perfil de
        outra conta manipulando a requisição. Sem sessão → **401**; sem `X-CSRF-Token` → **403**.

        `slug` é validado no formato e na unicidade: fora do padrão → **422**; já em uso por outra
        conta → **409** (RN009). O perfil continua sendo lido em `GET /autores/{slug}` — não há
        rota nova para o perfil público, e a alteração aparece lá (aquela rota só responde para
        conta `ATIVO`, ADR-0003 (b)).

        `afiliacaoDeclarada` é declaração do próprio autor e **nunca** vínculo verificado (RN011,
        §13.1): não existe neste contrato campo de selo, marca ou instituição verificada.

        A resposta é o perfil público atualizado. E-mail de login, hash e token não existem no
        schema — nem aqui, nem na leitura pública (RNF013).
      operationId: editarPerfilAtual
      security:
        - SessaoCookie: []
      parameters:
        - $ref: '#/components/parameters/TokenCsrf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdicaoPerfil'
            examples:
              edicaoCompleta:
                summary: Edição com todos os campos
                value:
                  nomePublico: Maria Silva
                  slug: maria-silva
                  biografia: Professora de programação; escreve material introdutório de algoritmos.
                  afiliacaoDeclarada: Declaro vínculo com a Universidade de Exemplo — autodeclaração, sem verificação da plataforma.
                  areasInteresse:
                    - algoritmos
                    - estruturas de dados
                  linksExternos:
                    - https://github.com/maria-silva
              opcionaisVazios:
                summary: Só os campos obrigatórios; os opcionais ficam vazios
                value:
                  nomePublico: João Souza
                  slug: joao-souza
                  biografia: ''
                  areasInteresse: []
                  linksExternos: []
      responses:
        '200':
          description: Perfil público atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilPublico'
              examples:
                perfilAtualizado:
                  summary: Perfil após a edição
                  value:
                    slug: maria-silva
                    nomePublico: Maria Silva
                    biografia: Professora de programação; escreve material introdutório de algoritmos.
                    afiliacaoDeclarada: Declaro vínculo com a Universidade de Exemplo — autodeclaração, sem verificação da plataforma.
                    areasInteresse:
                      - algoritmos
                    linksExternos:
                      - https://github.com/maria-silva
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroAcessoNegado'
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'
        '409':
          $ref: '#/components/responses/ErroConflitoUnicidade'
        '415':
          $ref: '#/components/responses/ErroTipoNaoSuportado'
        '422':
          $ref: '#/components/responses/ErroValidacaoCampo'
        '500':
          $ref: '#/components/responses/ErroInesperado'

  /perfil/atual/materiais:
    get:
      tags: [gerenciamento]
      summary: Lista os materiais próprios
      description: |-
        Lista paginada dos materiais da conta autenticada (RF015, DRS §7.4) — a visão do **dono**,
        que não é a do público: os três estados aparecem (`PUBLICADO`, `RETIRADO` e `EXCLUIDO`),
        porque esconder do dono o que ele acabou de excluir seria desonesto (ADR-0011 §2).

        **A propriedade vem da sessão, nunca do caminho** (RN001, CA007): não existe identificador de
        conta ou de perfil nesta rota, nem parâmetro que peça material de outra pessoa — a lista de A
        nunca contém material de B, e não há como pedir a de B.

        **Ordenação estável** por `atualizadoEm` decrescente, com desempate por `id` crescente: a
        ordem total é determinística, então paginar não repete nem omite item (RN013, RNF021). É a
        ordem da tela de gerenciamento ("o que mexi por último, primeiro"). Não há filtro nem
        ordenação alternativa no MVP — filtro vira contrato novo se o uso pedir.

        Conjunto vazio é **200 com `items: []`**, nunca erro (RNF004): é o estado normal de quem
        ainda não publicou, e é dele que a tela tira o primeiro passo.

        `size` acima de 100 é **400** (RNF021): o teto é **recusado**, nunca truncado em silêncio —
        uma lista que devolve menos do que foi pedido, sem dizer, faz o cliente acreditar que viu
        tudo. `page` negativo ou `size` menor que 1 seguem a mesma regra.

        Sem sessão → **401**. Nenhuma escrita acontece aqui, então não há `X-CSRF-Token` a exigir.
        Nenhum campo privado no corpo (RNF013): sem e-mail, sem hash, sem token, sem identificador de
        conta e sem `autor` — a autoria é sempre o dono, e é por isso que `MaterialProprio` não tem
        esse campo.
      operationId: listarMateriaisProprios
      security:
        - SessaoCookie: []
      parameters:
        - $ref: '#/components/parameters/NumeroPagina'
        - $ref: '#/components/parameters/TamanhoPagina'
      responses:
