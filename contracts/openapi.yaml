openapi: 3.1.0

info:
  title: SciPath API
  version: 0.3.0
  description: |
    Fronteira entre backend e frontend do SciPath. Este arquivo é a fonte de verdade:
    mudança de API começa aqui, no mesmo card da implementação (AGENTS.md, DRS §14.3).

    v0.3.0 — descoberta pública (card E2.1). Publica a fronteira do visitante sem conta:
    listar materiais públicos (`GET /api/materiais`), ver o detalhe de um material
    (`GET /api/materiais/{slug}`) e ver o perfil público de um autor com os materiais dele
    (`GET /api/autores/{slug}`). Três superfícies, todas somente-leitura, todas regidas
    pelas mesmas regras: só material PUBLICADO de conta ATIVA aparece (RN002), a licença
    vem sempre explícita com o que permite (RN006) e nenhum campo privado existe no schema
    (RNF013). Sobe a versão menor porque é a primeira vez que a busca e a leitura de
    material entram no contrato — mudança de fronteira real, não de redação.

    v0.2.1 — vocabulário de erro publicado por inteiro (card E1.1a). O backend já emitia
    sete classes `urn:scipath:erro:<slug>` desde o E1.4, mas o v0.2.0 só publicava duas
    (`validacao` e `interno`); as outras cinco ficavam fora da fronteira e o frontend
    teria de decidir sobre códigos que o contrato não conhecia (DRS §21.1). Nada no
    payload mudou — o backend não foi tocado e as mesmas respostas continuam valendo —,
    então a versão sobe em patch. O `type` agora é enumeração fechada no schema
    `ProblemDetail`, com a situação e o `errors[]` de cada classe.

    v0.2.0 — base do produto: estado operacional (RF022) e leitura da taxonomia de
    referência (RF018). Os endpoints de material herdados do esqueleto F0.1 foram
    removidos: não tinham requisito implementado, e uma fronteira publicada sem
    implementação faz o frontend codificar contra ficção (DRS §21.1). Serão reescritos
    na Etapa 2, quando tiverem requisito e modelo de dados no card que os especifica.

    Convenções vinculantes para todo endpoint:
    - **Erro único.** Toda resposta 4xx/5xx usa `application/problem+json` com o schema
      `ProblemDetail` (RFC 7807). `errors[]` só aparece em erro de campo. Não existe
      segundo formato de erro no contrato. O `type` é um vocabulário **fechado** de sete
      classes — `validacao` (400), `nao_autenticado` (401), `acesso_negado` (403),
      `nao_encontrado` (404), `metodo_nao_permitido` (405), `tipo_nao_suportado` (415) e
      `interno` (500) — enumerado no schema `ProblemDetail`, que também diz em que
      situação cada uma aparece e se ela carrega `errors[]`. Cliente que precisa de um
      `type` novo muda o contrato primeiro, nunca o código sozinho.
    - **Lista paginada única.** Toda listagem usa o envelope `Pagina` — `items`, `page`,
      `size`, `total` (RF002, RNF021) — com teto de `size` e ordenação estável
      documentada no endpoint, para que a navegação não duplique nem perca itens.
    - **Taxonomia.** Categorias, tipos de material e licenças são listas controladas de
      referência (RF018, RN005, RN006): `slug` é a chave estável e `nome` é só rótulo de
      exibição, que pode mudar sem quebrar dados (ADR-0006). São ordenadas por `nome` e
      filtráveis por estado ativo. Como listas de referência são curtas (13 categorias,
      6 tipos, 7 licenças no MVP), o cliente pode omitir `page` e `size` e sempre recebe
      `total` no envelope.

    Versionamento: mudança incompatível de caminho ou de payload sobe a versão menor
    deste documento e é registrada no card que a introduz. Migração de dados e
    alteração de taxonomia são migração Flyway nova, nunca edição de contrato publicada.

  contact:
    name: João Mateus de Sousa
    url: https://github.com/jmsousa07
    email: jmsousa07@users.noreply.github.com

servers:
  - url: http://localhost:8080/api
    description: ambiente local

tags:
  - name: sistema
    description: Estado operacional da API.
  - name: taxonomia
    description: Leitura da taxonomia de referência — categorias, tipos de material e licenças (RF018).
  - name: descoberta
    description: |-
      Descoberta pública, sem sessão: listar materiais, ver o detalhe de um material e o
      perfil público de um autor (RF002–RF007). Só material PUBLICADO de conta ATIVA.

paths:
  /health:
    get:
      tags: [sistema]
      summary: Estado da API
      description: |
        Informa se a API está no ar e se o banco responde (RF022 — estados operacionais
        claros). Serve à operação e ao monitoramento; nenhum fluxo do visitante depende
        deste endpoint. A resposta é sempre 200 quando a API está no ar: se o banco não
        responde, o corpo traz `status: DEGRADED` e `database: DOWN`, e o detalhe técnico
        fica só no log do servidor (RNF012). API fora do ar não é resposta HTTP — é falha
        de conexão, que o monitor percebe pelo status 200 ausente. Um endpoint que
        sinalizasse degradação por 503 exigiria mudar a implementação; se o
        monitoramento passar a depender disso, isso é mudança de contrato primeiro
        (AGENTS.md regra 1), em card próprio.
      operationId: getHealth
      responses:
        '200':
          description: API no ar; `status` e `database` informam o alcance do banco.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoApi'
              examples:
                operante:
                  summary: API operante, banco no ar
                  value:
                    status: UP
                    version: 0.2.0
                    database: UP
                degradado:
                  summary: API no ar, banco fora
                  value:
                    status: DEGRADED
                    version: 0.2.0
                    database: DOWN
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'

  /categorias:
    get:
      tags: [taxonomia]
      summary: Lista as categorias científicas
      description: |
        Devolve as categorias de referência para popular filtros de busca e o formulário
        de publicação (RF018, RN005). Filtro por estado ativo: sem o parâmetro, devolve
        apenas categorias ativas; com `ativo=false`, devolve também as desativadas.
        Ordenação estável por `nome` (ordem definida pelo servidor), para que a navegação
        entre páginas não repita nem perca itens. `slug` é a chave estável; o cliente
        guarda e envia o `slug`, nunca o `nome`.
      operationId: listCategorias
      parameters:
        - $ref: '#/components/parameters/FiltroAtivo'
        - $ref: '#/components/parameters/NumeroPagina'
        - $ref: '#/components/parameters/TamanhoPagina'
      responses:
        '200':
          description: Página de categorias, ordenada por nome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaCategorias'
              examples:
                primeiraPagina:
                  summary: Categorias ativas, primeira página
                  value:
                    items:
                      - id: 3f2c1a90-5b7e-4c21-9a11-8e0d2f6b7c44
                        slug: computacao-e-tecnologia
                        nome: Computação e Tecnologia
                        descricao: Software, dados, redes, inteligência artificial e demais áreas da computação.
                        ativo: true
                      - id: 8b1d4e77-0c93-4a52-b6d0-1f7e5a9c2d18
                        slug: matematica-e-estatistica
                        nome: Matemática e Estatística
                        descricao: Álgebra, cálculo, geometria, probabilidade e estatística.
                        ativo: true
                    page: 0
                    size: 20
                    total: 13
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'
        '500':
          $ref: '#/components/responses/ErroInesperado'

  /tipos-material:
    get:
      tags: [taxonomia]
      summary: Lista os tipos de material
      description: |
        Devolve os tipos de material de referência usados no filtro e no formulário de
        publicação (RF018). Filtro por estado ativo: sem o parâmetro, devolve apenas
        tipos ativos; com `ativo=false`, devolve também os desativados. Ordenação estável
        por `nome`. `slug` é a chave estável (ADR-0006).
      operationId: listTiposMaterial
      parameters:
        - $ref: '#/components/parameters/FiltroAtivo'
        - $ref: '#/components/parameters/NumeroPagina'
        - $ref: '#/components/parameters/TamanhoPagina'
      responses:
        '200':
          description: Página de tipos de material, ordenada por nome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaTiposMaterial'
              examples:
                primeiraPagina:
                  summary: Tipos de material ativos
                  value:
                    items:
                      - id: 1c9e5a30-7d24-4f61-8b02-2a6f1d3e9c05
                        slug: nota-de-aula
                        nome: Nota de aula
                        ativo: true
                      - id: 5d0b2f18-9a63-4c77-8e14-6b3c7f204a91
                        slug: slides
                        nome: Slides
                        ativo: true
                    page: 0
                    size: 20
                    total: 6
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'
        '500':
          $ref: '#/components/responses/ErroInesperado'

  /licencas:
    get:
      tags: [taxonomia]
      summary: Lista as licenças de reutilização
      description: |
        Devolve as licenças de referência disponíveis para o autor escolher na publicação
        (RF018, RN006). Filtro por estado ativo: sem o parâmetro, devolve apenas licenças
        ativas; com `ativo=false`, devolve também as desativadas. Ordenação estável por
        `nome`. Cada item traz `descricaoCurta`, em linguagem simples, do que a licença
        permite — a licença nunca é decorativa nem sugere que estar público significa
        domínio público (RN006, §13.2). `identificador` e `urlReferencia` podem vir
        ausentes quando a licença não tem identificador nem URL públicos (caso de "Todos
        os direitos reservados").
      operationId: listLicencas
      parameters:
        - $ref: '#/components/parameters/FiltroAtivo'
        - $ref: '#/components/parameters/NumeroPagina'
        - $ref: '#/components/parameters/TamanhoPagina'
      responses:
        '200':
          description: Página de licenças, ordenada por nome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaLicencas'
              examples:
                primeiraPagina:
                  summary: Licenças ativas
                  value:
                    items:
                      - id: 9a7d3c16-4e80-4b95-a173-0f5c8e2b6d47
                        slug: cc-by-4.0
                        nome: CC BY 4.0
                        identificador: CC-BY-4.0
                        urlReferencia: https://creativecommons.org/licenses/by/4.0/
                        descricaoCurta: Você pode reutilizar e adaptar o material, inclusive comercialmente, dando crédito ao autor.
                        ativo: true
                      - id: 2e5b8f04-6c17-4d38-9f26-7a1b4c9e0d53
                        slug: todos-os-direitos-reservados
                        nome: Todos os direitos reservados
                        descricaoCurta: O material continua protegido. Ler e baixar é permitido; reutilizar não é.
                        ativo: true
                    page: 0
                    size: 20
                    total: 7
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'
        '500':
          $ref: '#/components/responses/ErroInesperado'

  /materiais:
    get:
      tags: [descoberta]
      summary: Lista materiais públicos
      description: |
        Lista paginada de materiais PUBLICADOS de contas ATIVAS (RF002, RN002, §11.3). É a
        fronteira da descoberta: o visitante sem conta encontra material por busca (`q`) e
        filtros explícitos de categoria e tipo, e ordena por um critério documentado.

        Resultado previsível: a ordenação padrão é `recentes` — `publicadoEm` decrescente
        com desempate **estável** por `id` crescente (§12.2) —, o que garante que navegar
        entre páginas não duplica nem omite item (RN013). Não existe ordenação por
        "relevância" nem por popularidade: destaque exigiria regra explícita de seleção
        (§12.4), e o contrato não publica o que o produto não calcula.

        Conjunto vazio é **200 com `items: []`**, nunca erro (RNF004): é o estado normal de
        um filtro sem resultado ou de um acervo ainda vazio.

        Cada item carrega título, descrição, autor, categoria, tipo, licença e data
        (RF002). A licença vem sempre com `descricaoCurta` (RN006): estar público não
        significa domínio público (§13.2).

        SEO (RNF024): a rota `/explorar` do frontend emite `title`, `description` e
        `canonical` estáveis; o contrato garante os dados que alimentam esses campos
        (`titulo`, `descricao`, `slug`) para que a listagem tenha conteúdo real no HTML.
      operationId: listMateriais
      parameters:
        - $ref: '#/components/parameters/FiltroBusca'
        - $ref: '#/components/parameters/FiltroCategoria'
        - $ref: '#/components/parameters/FiltroTipo'
        - $ref: '#/components/parameters/OrdemMateriais'
        - $ref: '#/components/parameters/NumeroPagina'
        - $ref: '#/components/parameters/TamanhoPagina'
      responses:
        '200':
          description: Página de materiais, na ordenação pedida (padrão `recentes`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaMateriais'
              examples:
                primeiraPagina:
                  summary: Página inicial na ordenação padrão (recentes)
                  value:
                    items:
                      - slug: introducao-a-algoritmos-de-ordenacao
                        titulo: Introdução a algoritmos de ordenação
                        descricao: Nota de aula sobre ordenação por comparação, com análise de complexidade e exemplos em pseudocódigo.
                        autor:
                          slug: maria-silva
                          nomePublico: Maria Silva
                        categoria:
                          slug: computacao-e-tecnologia
                          nome: Computação e Tecnologia
                        tipo:
                          slug: nota-de-aula
                          nome: Nota de aula
                        licenca:
                          slug: cc-by-4.0
                          nome: CC BY 4.0
                          descricaoCurta: Você pode reutilizar e adaptar o material, inclusive comercialmente, dando crédito ao autor.
                        publicadoEm: '2026-10-14T15:10:00Z'
                    page: 0
                    size: 20
                    total: 1
                filtroSemResultado:
                  summary: Filtro sem resultado — 200 com lista vazia
                  value:
                    items: []
                    page: 0
                    size: 20
                    total: 0
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'
        '500':
          $ref: '#/components/responses/ErroInesperado'

  /materiais/{slug}:
    get:
      tags: [descoberta]
      summary: Detalhe do material público
      description: |
        Devolve o material identificado pelo `slug` público (RF005), com autoria, categoria,
        tipo, licença explicada e estado de publicação.

        Visibilidade: material inexistente, RETIRADO ou EXCLUIDO responde **404** — os três
        de forma indistinguível, para não revelar a existência de material fora do público
        (RN002, CA008). É o mesmo `urn:scipath:erro:nao_encontrado` de qualquer endereço sem
        recurso.

        Transparência: a resposta é o que o autor declarou. Não há marca de revisão,
        certificação, curadoria ou verificação científica (RN010, RN011, CA012).

        Nenhum dado privado (RNF013): fora do schema ficam e-mail, hash de senha, token e
        qualquer identificador de conta.

        SEO (RNF024, RNF025): a rota `/materiais/{slug}` do frontend emite `title` =
        `titulo`, `description` = `descricao` e `canonical` derivado do próprio `slug` — URL
        estável, sem depender de estado do navegador. Dados estruturados só se forem
        corretos (§12.3).

        Acesso ao arquivo não está nesta versão: a Etapa 2 não serve arquivo, e publicar um
        campo de download sem implementação seria fronteira contra ficção (DRS §21.1). Entra
        no card que implementar RF014.
      operationId: getMaterial
      parameters:
        - $ref: '#/components/parameters/SlugRecurso'
      responses:
        '200':
          description: Material público encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialDetalhe'
              examples:
                material:
                  summary: Material publicado
                  value:
                    slug: introducao-a-algoritmos-de-ordenacao
                    titulo: Introdução a algoritmos de ordenação
                    descricao: Nota de aula sobre ordenação por comparação, com análise de complexidade e exemplos em pseudocódigo.
                    autor:
                      slug: maria-silva
                      nomePublico: Maria Silva
                    categoria:
                      slug: computacao-e-tecnologia
                      nome: Computação e Tecnologia
                    tipo:
                      slug: nota-de-aula
                      nome: Nota de aula
                    licenca:
                      slug: cc-by-4.0
                      nome: CC BY 4.0
                      identificador: CC-BY-4.0
                      urlReferencia: https://creativecommons.org/licenses/by/4.0/
                      descricaoCurta: Você pode reutilizar e adaptar o material, inclusive comercialmente, dando crédito ao autor.
                    estado: PUBLICADO
                    publicadoEm: '2026-10-14T15:10:00Z'
                    atualizadoEm: '2026-10-14T15:10:00Z'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'
        '500':
          $ref: '#/components/responses/ErroInesperado'

  /autores/{slug}:
    get:
      tags: [descoberta]
      summary: Perfil público do autor e seus materiais
      description: |
        Devolve a identidade pública do autor (RF006) e a página dos materiais publicados
        dele (`materiais`, no envelope padrão). `page` e `size` paginam **os materiais do
        autor**; a identidade vem sempre completa.

        Visibilidade: perfil de conta não ATIVA responde **404**, indistinguível de slug
        inexistente (RN002, CA008). Autor sem material publicado responde **200 com lista
        vazia** — ausência de material não é perfil inexistente (E2.5).

        Nada privado (RNF013): e-mail de login, hash de senha, token e id de conta não
        existem neste schema. `afiliacaoDeclarada` é declaração do próprio autor, nunca
        vínculo verificado (RN011, §13.1).

        SEO (RNF024, RNF025): a rota `/u/{slug}` do frontend emite `title` = `nomePublico`,
        `description` a partir de `biografia` e `canonical` derivado do próprio `slug`.
      operationId: getAutor
      parameters:
        - $ref: '#/components/parameters/SlugRecurso'
        - $ref: '#/components/parameters/NumeroPagina'
        - $ref: '#/components/parameters/TamanhoPagina'
      responses:
        '200':
          description: Perfil público do autor com a página dos materiais dele.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutorPublico'
              examples:
                comMateriais:
                  summary: Autor com material publicado
                  value:
                    slug: maria-silva
                    nomePublico: Maria Silva
                    biografia: Professora de programação; escreve material introdutório de algoritmos.
                    afiliacaoDeclarada: Declaro vínculo com a Universidade de Exemplo — autodeclaração, sem verificação da plataforma.
                    areasInteresse:
                      - algoritmos
                      - estruturas de dados
                    linksExternos:
                      - https://github.com/maria-silva
                    materiais:
                      items:
                        - slug: introducao-a-algoritmos-de-ordenacao
                          titulo: Introdução a algoritmos de ordenação
                          descricao: Nota de aula sobre ordenação por comparação, com análise de complexidade e exemplos em pseudocódigo.
                          autor:
                            slug: maria-silva
                            nomePublico: Maria Silva
                          categoria:
                            slug: computacao-e-tecnologia
                            nome: Computação e Tecnologia
                          tipo:
                            slug: nota-de-aula
                            nome: Nota de aula
                          licenca:
                            slug: cc-by-4.0
                            nome: CC BY 4.0
                            descricaoCurta: Você pode reutilizar e adaptar o material, inclusive comercialmente, dando crédito ao autor.
                          publicadoEm: '2026-10-14T15:10:00Z'
                      page: 0
                      size: 20
                      total: 1
                semMateriais:
                  summary: Autor sem material publicado — 200 com lista vazia
                  value:
                    slug: joao-sem-publicacao
                    nomePublico: João Sem Publicação
                    areasInteresse: []
                    linksExternos: []
                    materiais:
                      items: []
                      page: 0
                      size: 20
                      total: 0
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'
        '500':
          $ref: '#/components/responses/ErroInesperado'

components:
  parameters:
    FiltroAtivo:
      name: ativo
      in: query
      required: false
      description: |
        Filtra por estado ativo do item de referência. Omitido, devolve apenas itens
        ativos; `false` inclui também os desativados (desativar taxonomia é migração
        Flyway — ADR-0006).
      schema:
        type: boolean
        default: true
      example: true

    NumeroPagina:
      name: page
      in: query
      required: false
      description: Número da página, começando em 0.
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0

    TamanhoPagina:
      name: size
      in: query
      required: false
      description: Itens por página. Teto de 100 por requisição (RNF021).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

    FiltroBusca:
      name: q
      in: query
      required: false
      description: |
        Busca lexical sobre `titulo` e `descricao` do material (RF003, §12.1). Resistente a
        acento e caixa: "matemática" e "matematica" casam o mesmo conjunto. Ausente ou vazia
        não é erro — devolve a listagem padrão (RF003). Não há ordenação nem promessa de
        relevância: o resultado sai na ordenação pedida por `ordem` (§12.2). Caracteres
        especiais são tratados como texto, nunca como operador (§12.1). Termo acima do teto
        de `maxLength` é recusado com **400** (ADR-0008): cortar em silêncio mudaria o
        resultado sem o cliente saber.
      schema:
        type: string
        maxLength: 200
      example: algoritmos de ordenação

    FiltroCategoria:
      name: categoria
      in: query
      required: false
      description: |
        Filtra por `slug` da categoria do material (RF004). O valor é o `slug` estável
        devolvido em `categoria.slug` (ADR-0006, RF007) — não o `nome`. Slug bem formado mas
        inexistente devolve **200 vazio**, nunca 404; valor fora do formato de slug devolve
        **400** no `ProblemDetail` padrão.
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      example: computacao-e-tecnologia

    FiltroTipo:
      name: tipo
      in: query
      required: false
      description: |
        Filtra por `slug` do tipo de material (RF004). Mesmo contrato do filtro de
        categoria: `slug` estável, desconhecido → 200 vazio, mal formado → 400.
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      example: nota-de-aula

    OrdemMateriais:
      name: ordem
      in: query
      required: false
      description: |
        Critério de ordenação da listagem (§12.2). `recentes` (padrão) ordena por
        `publicadoEm` decrescente com desempate **estável** por `id`; `titulo` ordena por
        `titulo` crescente com o mesmo desempate por `id` — em ambos, a ordem total é
        determinística, então paginar não duplica nem omite item (RN013). Não existe ordem
        por "relevância" nem por contagem de popularidade (§12.2, §12.4). Valor fora do
        enum → **400**.
      schema:
        type: string
        enum: [recentes, titulo]
        default: recentes
      example: recentes

    SlugRecurso:
      name: slug
      in: path
      required: true
      description: |
        Identificador público do recurso — o `slug` estável do material ou do perfil
        (RN009, RNF025). Valor fora do formato de slug → 400; slug bem formado que não
        existe (ou não é público) → 404.
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        maxLength: 120
      example: introducao-a-algoritmos-de-ordenacao

  responses:
    ErroValidacao:
      description: |
        Entrada inválida (parâmetro de consulta ou corpo). Resposta no formato único de
        erro, com `errors[]` apontando o campo culpado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            parametroInvalido:
              summary: Parâmetro de consulta inválido
              value:
                type: urn:scipath:erro:validacao
                title: Requisição inválida
                status: 400
                detail: O parâmetro 'ativo' deve ser true ou false.
                instance: /api/categorias
                errors:
                  - campo: ativo
                    mensagem: deve ser true ou false

    ErroNaoEncontrado:
      description: |
        Recurso ausente ou não público. A resposta é a mesma para material inexistente,
        material RETIRADO ou EXCLUIDO e perfil de conta não ATIVA — de propósito, para não
        revelar a existência de conteúdo fora do público (RN002, CA008). Sem `errors[]`:
        recurso ausente não é erro de campo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            recursoForaDoPublico:
              summary: Material inexistente ou não público
              value:
                type: urn:scipath:erro:nao_encontrado
                title: Recurso não encontrado
                status: 404
                detail: O recurso solicitado não foi encontrado.
                instance: /api/materiais/exemplo-material-fora-do-publico

    ErroMetodoNaoPermitido:
      description: |
        Método HTTP não aceito neste endereço. O endereço existe, mas não responde a este
        método; `detail` diz qual usar. Sem `errors[]`: método não é campo, e o contrato
        reserva `errors[]` para erro de campo (RNF004 põe a orientação no `detail`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            metodoErrado:
              summary: POST num endpoint de leitura
              value:
                type: urn:scipath:erro:metodo_nao_permitido
                title: Método não permitido
                status: 405
                detail: O método POST não é aceito neste endereço. Use GET.
                instance: /api/categorias

    ErroInesperado:
      description: |
        Falha interna. A resposta não carrega stack trace, SQL nem caminho de arquivo
        (RNF012); o detalhe técnico fica apenas no log do servidor.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            falhaInterna:
              summary: Erro interno
              value:
                type: urn:scipath:erro:interno
                title: Erro interno
                status: 500
                detail: Não foi possível concluir a operação. Tente novamente.
                instance: /api/categorias

  schemas:
    EstadoApi:
      type: object
      description: Estado operacional da API (RF022).
      required: [status, version, database]
      properties:
        status:
          type: string
          enum: [UP, DEGRADED]
          description: UP quando API e banco respondem; DEGRADED quando a API responde e o banco não.
          example: UP
        version:
          type: string
          description: Versão do contrato em execução.
          example: 0.2.0
        database:
          type: string
          enum: [UP, DOWN]
          description: Alcance do banco de dados.
          example: UP

    Categoria:
      type: object
      description: Categoria científica de referência (ADR-0006).
      required: [id, slug, nome, descricao, ativo]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador interno; o cliente não deriva significado dele.
          example: 3f2c1a90-5b7e-4c21-9a11-8e0d2f6b7c44
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Chave estável da categoria; é o valor que o cliente guarda e envia.
          example: computacao-e-tecnologia
        nome:
          type: string
          description: Rótulo de exibição; pode mudar sem quebrar dados.
          example: Computação e Tecnologia
        descricao:
          type: string
          description: Descrição curta, para descoberta e SEO (DRS §12).
          example: Software, dados, redes, inteligência artificial e demais áreas da computação.
        ativo:
          type: boolean
          description: Item de referência ativo; inativos só aparecem com `ativo=false`.
          example: true

    TipoMaterial:
      type: object
      description: Tipo de material de referência (ADR-0006).
      required: [id, slug, nome, ativo]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador interno; o cliente não deriva significado dele.
          example: 1c9e5a30-7d24-4f61-8b02-2a6f1d3e9c05
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Chave estável do tipo; é o valor que o cliente guarda e envia.
          example: nota-de-aula
        nome:
          type: string
          description: Rótulo de exibição; pode mudar sem quebrar dados.
          example: Nota de aula
        ativo:
          type: boolean
          description: Item de referência ativo; inativos só aparecem com `ativo=false`.
          example: true

    Licenca:
      type: object
      description: Licença de reutilização de referência (ADR-0006, RN006).
      required: [id, slug, nome, descricaoCurta, ativo]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador interno; o cliente não deriva significado dele.
          example: 9a7d3c16-4e80-4b95-a173-0f5c8e2b6d47
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9.]+)*$'
          description: Chave estável da licença; é o valor que o cliente guarda e envia.
          example: cc-by-4.0
        nome:
          type: string
          description: Rótulo de exibição da licença.
          example: CC BY 4.0
        identificador:
          type: string
          description: |
            Identificador público da licença (ex.: SPDX). Ausente quando a licença não
            tem identificador público ("Todos os direitos reservados").
          example: CC-BY-4.0
        urlReferencia:
          type: string
          format: uri
          description: |
            URL do texto de referência da licença. Ausente quando não existe texto
            público ("Todos os direitos reservados").
          example: https://creativecommons.org/licenses/by/4.0/
        descricaoCurta:
          type: string
          description: Explicação em linguagem simples do que a licença permite (RN006).
          example: Você pode reutilizar e adaptar o material, inclusive comercialmente, dando crédito ao autor.
        ativo:
          type: boolean
          description: Item de referência ativo; inativos só aparecem com `ativo=false`.
          example: true

    Pagina:
      type: object
      description: |
        Envelope padrão de lista paginada (RF002, RNF021). Toda listagem responde
        exatamente estes quatro campos; o endpoint especializa `items` no schema do
        recurso (`PaginaCategorias`, `PaginaTiposMaterial`, `PaginaLicencas`,
        `PaginaMateriais`). `page` começa em 0, `size` tem teto por requisição e a
        ordenação do endpoint é estável, para que páginas não repitam nem pulem itens.
      required: [items, page, size, total]
      properties:
        items:
          type: array
          description: Itens da página corrente.
          items: {}
        page:
          type: integer
          minimum: 0
          description: Número da página corrente, começando em 0.
          example: 0
        size:
          type: integer
          minimum: 1
          description: Itens solicitados por página.
          example: 20
        total:
          type: integer
          minimum: 0
          description: Total de itens que atendem à consulta, independente da página.
          example: 13
      example:
        items:
          - id: 3f2c1a90-5b7e-4c21-9a11-8e0d2f6b7c44
            slug: computacao-e-tecnologia
            nome: Computação e Tecnologia
            descricao: Software, dados, redes, inteligência artificial e demais áreas da computação.
            ativo: true
        page: 0
        size: 20
        total: 13

    PaginaCategorias:
      description: Envelope de paginação (ver `Pagina`) com categorias em `items`.
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Categoria'

    PaginaTiposMaterial:
      description: Envelope de paginação (ver `Pagina`) com tipos de material em `items`.
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/TipoMaterial'

    PaginaLicencas:
      description: Envelope de paginação (ver `Pagina`) com licenças em `items`.
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Licenca'

    CategoriaRef:
      type: object
      description: |
        Categoria de referência anexada a um material (dados do ADR-0006), reduzida ao que
        a descoberta precisa exibir e navegar. O cliente usa `slug` para filtrar e para
        linkar a página da categoria (RF007); `nome` é só rótulo de exibição.
      required: [slug, nome]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Chave estável da categoria; é o mesmo valor aceito pelo filtro `categoria`.
          example: computacao-e-tecnologia
        nome:
          type: string
          description: Rótulo de exibição da categoria.
          example: Computação e Tecnologia

    TipoMaterialRef:
      type: object
      description: |
        Tipo de material anexado a um material (dados do ADR-0006), reduzido ao necessário
        para exibir e filtrar. `slug` é a chave estável aceita pelo filtro `tipo`.
      required: [slug, nome]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Chave estável do tipo; é o mesmo valor aceito pelo filtro `tipo`.
          example: nota-de-aula
        nome:
          type: string
          description: Rótulo de exibição do tipo.
          example: Nota de aula

    LicencaRef:
      type: object
      description: |
        Licença de reutilização do material, sempre explícita (RN006). `descricaoCurta` é
        obrigatória porque é ela que impede a leitura errada de que "estar público" significa
        domínio público (§13.2); a resposta nunca traz só o nome da licença.
      required: [slug, nome, descricaoCurta]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9.]+)*$'
          description: Chave estável da licença.
          example: cc-by-4.0
        nome:
          type: string
          description: Rótulo de exibição da licença.
          example: CC BY 4.0
        identificador:
          type: string
          description: |
            Identificador público da licença (ex.: SPDX). Ausente quando a licença não tem
            identificador público ("Todos os direitos reservados").
          example: CC-BY-4.0
        urlReferencia:
          type: string
          format: uri
          description: |
            URL do texto de referência da licença. Ausente quando não há texto público
            ("Todos os direitos reservados").
          example: https://creativecommons.org/licenses/by/4.0/
        descricaoCurta:
          type: string
          description: Explicação em linguagem simples do que a licença permite e do que não permite (RN006).
          example: Você pode reutilizar e adaptar o material, inclusive comercialmente, dando crédito ao autor.

    AutorResumo:
      type: object
      description: |
        Identidade pública do autor na listagem — o mínimo para exibir no card e linkar o
        perfil (RF002, RF007). Nunca carrega e-mail, conta, hash ou token (RNF013).
      required: [slug, nomePublico]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Slug público do perfil; é o valor da rota `/autores/{slug}` (RNF025).
          example: maria-silva
        nomePublico:
          type: string
          description: Nome público exibido como autor do material.
          example: Maria Silva

    MaterialResumo:
      type: object
      description: |
        Item de material na descoberta pública (RF002). Todo material devolvido está
        PUBLICADO e pertence a conta ATIVA (RN002, §11.3): `estado` não é campo porque,
        nesta superfície, ele é sempre PUBLICADO — material retirado ou excluído
        simplesmente não aparece. Licença sempre presente (RN006). Sem marca de revisão,
        certificação, curadoria ou verificação (RN010, RN011).
      required: [slug, titulo, descricao, autor, categoria, tipo, licenca, publicadoEm]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Identificador público e estável do material; é o valor da rota `/materiais/{slug}` (RNF025).
          example: introducao-a-algoritmos-de-ordenacao
        titulo:
          type: string
          description: Título do material (RN004). É o `title` de SEO na página do material.
          example: Introdução a algoritmos de ordenação
        descricao:
          type: string
          description: Descrição curta do material (RN004). É a base do `description` de SEO.
          example: Nota de aula sobre ordenação por comparação, com análise de complexidade e exemplos em pseudocódigo.
        autor:
          $ref: '#/components/schemas/AutorResumo'
        categoria:
          $ref: '#/components/schemas/CategoriaRef'
        tipo:
          $ref: '#/components/schemas/TipoMaterialRef'
        licenca:
          $ref: '#/components/schemas/LicencaRef'
        publicadoEm:
          type: string
          format: date-time
          description: Instante da publicação; chave da ordenação padrão `recentes` (§12.2).
          example: '2026-10-14T15:10:00Z'
        atualizadoEm:
          type: string
          format: date-time
          description: Última atualização do material. Presente quando difere da publicação.
          example: '2026-10-15T09:00:00Z'

    MaterialDetalhe:
      type: object
      description: |
        Material público completo (RF005): autoria, categoria, tipo, licença explicada e
        estado de publicação. Nenhum dado privado — não há e-mail, hash, token, chave de
        storage nem identificador de conta (RNF013). Nenhuma marca de revisão,
        certificação, curadoria ou verificação científica (RN010, RN011, CA012).

        O acesso ao arquivo (nome, formato, download) não faz parte desta versão: a Etapa 2
        não serve arquivo, e publicar um campo de download sem implementação seria fronteira
        contra ficção (DRS §21.1). Entra no card que implementar RF014.
      required: [slug, titulo, descricao, autor, categoria, tipo, licenca, estado, publicadoEm, atualizadoEm]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Identificador público e estável do material; base da URL canônica (RNF025).
          example: introducao-a-algoritmos-de-ordenacao
        titulo:
          type: string
          description: Título do material (RN004). É o `title` de SEO da página.
          example: Introdução a algoritmos de ordenação
        descricao:
          type: string
          description: Descrição do material (RN004). É o `description` de SEO da página.
          example: Nota de aula sobre ordenação por comparação, com análise de complexidade e exemplos em pseudocódigo.
        autor:
          $ref: '#/components/schemas/AutorResumo'
        categoria:
          $ref: '#/components/schemas/CategoriaRef'
        tipo:
          $ref: '#/components/schemas/TipoMaterialRef'
        licenca:
          $ref: '#/components/schemas/LicencaRef'
        estado:
          type: string
          enum: [PUBLICADO]
          description: |
            Estado de publicação. Nesta superfície é sempre `PUBLICADO`: material RETIRADO
            ou EXCLUIDO responde 404, indistinguível de inexistente (RN002, CA008).
          example: PUBLICADO
        publicadoEm:
          type: string
          format: date-time
          description: Instante da publicação.
          example: '2026-10-14T15:10:00Z'
        atualizadoEm:
          type: string
          format: date-time
          description: Instante da última atualização (RF005).
          example: '2026-10-14T15:10:00Z'

    AutorPublico:
      type: object
      description: |
        Identidade pública do autor (RF006, §11.1.2) e a página dos materiais publicados
        dele. `afiliacaoDeclarada` é DECLARAÇÃO do próprio autor (RN011, §13.1): o contrato
        nunca a apresenta como vínculo verificado. Nenhum dado de conta — e-mail de login,
        hash de senha, token e id de conta ficam fora do schema (RNF013).
      required: [slug, nomePublico, areasInteresse, linksExternos, materiais]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Slug público e único do perfil; base da URL canônica `/u/{slug}` (RNF025).
          example: maria-silva
        nomePublico:
          type: string
          description: Nome público do autor (RF006).
          example: Maria Silva
        biografia:
          type: string
          description: Biografia do autor. Opcional; ausente quando não informada (RN004).
          example: Professora de programação; escreve material introdutório de algoritmos.
        afiliacaoDeclarada:
          type: string
          description: |
            Afiliação DECLARADA pelo autor — nunca vínculo verificado pela plataforma
            (RN011, §13.1). Ausente quando não informada.
          example: Declaro vínculo com a Universidade de Exemplo — autodeclaração, sem verificação da plataforma.
        areasInteresse:
          type: array
          description: Áreas de interesse declaradas. Lista vazia quando o autor não informou.
          items:
            type: string
          example: [algoritmos, estruturas de dados]
        linksExternos:
          type: array
          description: |
            Links externos declarados pelo autor (texto livre, sem verificação no MVP).
            Lista vazia quando o autor não informou.
          items:
            type: string
          example: [https://github.com/maria-silva]
        materiais:
          description: |
            Página dos materiais publicados do autor, no envelope padrão. `page` e `size` da
            requisição paginam esta lista; autor sem material publicado responde 200 com
            `items: []` (E2.5).
          $ref: '#/components/schemas/PaginaMateriais'

    PaginaMateriais:
      description: Envelope de paginação (ver `Pagina`) com materiais públicos em `items`.
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MaterialResumo'

    ProblemDetail:
      type: object
      description: |
        Formato único de erro do contrato (RFC 7807, `application/problem+json`),
        usado em toda resposta 4xx/5xx. `type` é um URN estável que identifica a classe
        do erro (`urn:scipath:erro:<slug>`), o cliente decide pelo `type`, nunca pelo
        texto; `title` é o rótulo curto e estável; `detail` explica o caso concreto e é
        seguro para exibir (RNF012 — sem stack trace, SQL ou caminho de arquivo);
        `errors[]` só aparece em erro de campo, nunca em erro sistêmico.

        Vocabulário fechado: a API emite exatamente estas sete classes, cada uma com o
        status HTTP correspondente. O `status` no corpo repete o status da resposta; o
        cliente decide por `type`.

        | `type` | status | situação | `errors[]` |
        |---|---|---|---|
        | `urn:scipath:erro:validacao` | 400 | entrada recusada: parâmetro de consulta ou corpo inválido | sim, um item por campo culpado |
        | `urn:scipath:erro:nao_autenticado` | 401 | a operação exige identidade e não há sessão válida (passa a ocorrer na Etapa 3) | não |
        | `urn:scipath:erro:acesso_negado` | 403 | há identidade, mas ela não tem permissão para a operação (passa a ocorrer na Etapa 3) | não |
        | `urn:scipath:erro:nao_encontrado` | 404 | o recurso pedido não existe, ou o endereço não corresponde a nenhum recurso ou endpoint | não |
        | `urn:scipath:erro:metodo_nao_permitido` | 405 | o endereço existe, mas não responde a este método | não |
        | `urn:scipath:erro:tipo_nao_suportado` | 415 | o `Content-Type` enviado não é aceito | não |
        | `urn:scipath:erro:interno` | 500 | falha inesperada; detalhe técnico fica só no log do servidor | não |

        `errors[]` é exclusivo do erro de campo (400): 405, 415 e 500 não carregam a
        lista porque método, `Content-Type` e falha interna não são campos — nesses
        casos a orientação está no `detail`.

        Um endpoint só documenta os status que o seu caminho pode produzir: 405 aparece
        em todo endpoint publicado (o caminho existe, o método errado é recusado); 404
        aparece nos endpoints com recurso no caminho (`/materiais/{slug}`,
        `/autores/{slug}`); 401 e 403 entram quando a operação exigir identidade (Etapa 3).
        A classe existe neste schema desde já porque o formato foi implementado de uma vez
        (card E1.4) — o que muda depois é qual endpoint pode devolvê-la, não o formato.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          enum:
            - urn:scipath:erro:validacao
            - urn:scipath:erro:nao_autenticado
            - urn:scipath:erro:acesso_negado
            - urn:scipath:erro:nao_encontrado
            - urn:scipath:erro:metodo_nao_permitido
            - urn:scipath:erro:tipo_nao_suportado
            - urn:scipath:erro:interno
          description: |
            Classe do erro, uma das sete do vocabulário. `type` novo é mudança de
            contrato antes de ser mudança de código (AGENTS.md regra 1).
          example: urn:scipath:erro:validacao
        title:
          type: string
          description: Rótulo curto e estável da classe do erro.
          example: Requisição inválida
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: Código HTTP, repetido no corpo.
          example: 400
        detail:
          type: string
          description: Explicação do caso concreto, segura para exibir ao usuário.
          example: O parâmetro 'ativo' deve ser true ou false.
        instance:
          type: string
          description: Caminho da requisição que originou o erro.
          example: /api/categorias
        errors:
          type: array
          description: Erros de campo; ausente quando o erro não é de validação.
          items:
            $ref: '#/components/schemas/ErroDeCampo'
      example:
        type: urn:scipath:erro:validacao
        title: Requisição inválida
        status: 400
        detail: O parâmetro 'ativo' deve ser true ou false.
        instance: /api/categorias
        errors:
          - campo: ativo
            mensagem: deve ser true ou false

    ErroDeCampo:
      type: object
      description: Um campo recusado pela validação, identificado pelo caminho no payload.
      required: [campo, mensagem]
      properties:
        campo:
          type: string
          description: Caminho do campo no payload ou nome do parâmetro de consulta.
          example: ativo
        mensagem:
