      summary: Lista materiais públicos
      description: |
        Lista paginada de materiais PUBLICADOS de contas ATIVAS (RF002, RN002, §11.3). É a
        fronteira da descoberta: o visitante sem conta encontra material por busca (`q`) e
        filtros explícitos de categoria e tipo, e ordena por um critério documentado.

        Resultado previsível: a ordenação padrão é `recentes` — `publicadoEm` decrescente
        com desempate **estável** por `id` crescente (§12.2) —, o que garante que navegar
        entre páginas não duplica nem omite item (RN013). Não existe ordenação por
        "relevância" nem por popularidade: destaque exigiria regra explícita de seleção
        (§12.4), e o contrato não publica o que o produto não calcula.

        Conjunto vazio é **200 com `items: []`**, nunca erro (RNF004): é o estado normal de
        um filtro sem resultado ou de um acervo ainda vazio.

        Cada item carrega título, descrição, autor, categoria, tipo, licença e data
        (RF002). A licença vem sempre com `descricaoCurta` (RN006): estar público não
        significa domínio público (§13.2).

        SEO (RNF024): a rota `/explorar` do frontend emite `title`, `description` e
        `canonical` estáveis; o contrato garante os dados que alimentam esses campos
        (`titulo`, `descricao`, `slug`) para que a listagem tenha conteúdo real no HTML.
