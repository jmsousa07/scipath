        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'
        '500':
          $ref: '#/components/responses/ErroInesperado'
    put:
      tags: [gerenciamento]
      summary: Edita os metadados de um material próprio
      description: |-
        Substitui o conjunto editável dos metadados do material próprio (RF016, DRS §8.3.5): título,
        descrição, categoria, tipo de material e licença — os cinco campos de `EdicaoDeMaterial`, com
        os mesmos limites e as mesmas recusas da publicação.

        **O que não se edita aqui, e por quê** (ADR-0011 §4): `slug` é a URL canônica pública
        (RNF025) e trocá-lo quebraria link e indexação; autoria e propriedade vêm da sessão (RN001),
        e `autorSlug`, `contaId` ou `perfilId` no corpo são **ignorados** — não há campo para eles;
        `estado` é o `PATCH`; o arquivo é o da publicação (trocar o binário mexe em validação,
        armazenamento, órfãos e retenção — operação sem requisito no MVP); e `declaracaoDireito`
        pertence ao ato de publicar (RF012) e não é re-perguntada aqui.

        **Propriedade verificada no servidor** (RF016, RN013, CA007, RNF010): material inexistente,
        de outra conta ou já `EXCLUIDO` responde **404 com o mesmo corpo do 404 público**, e
        **nenhuma escrita acontece** — esconder o botão na tela não é controle. `PUBLICADO` e
        `RETIRADO` são editáveis; `EXCLUIDO` é terminal no MVP (ADR-0011 §6).

        **Editar não exige conta `ATIVO`** (ADR-0003 (b)): quem está em `PENDENTE_VERIFICACAO` edita
        o que já publicou — a verificação é exigida para **pôr** material no público (publicar e
        republicar), não para mantê-lo lá.

        Quando o material está `PUBLICADO`, a alteração aparece no detalhe público
        (`GET /materiais/{slug}`) — é o RF016 pedindo que a página pública reflita a mudança.
        `atualizadoEm` sobe com a escrita; **`publicadoEm` não muda**, e a republicação também não o
        reescreve (senão retirar e publicar de novo seria manobra para subir ao topo da listagem
        pública, que ordena por `publicado_em`).

        Campo obrigatório ausente no corpo → **400** (o servidor não conseguiu ler o pedido como
        veio); campo presente com valor inválido, ou taxonomia inexistente ou inativa → **422** no
        campo (`errors[]`), o mesmo vocabulário da publicação (RF018; o exemplo
        `categoriaInexistente` de `ErroValidacaoCampo` é exatamente este caso).

        A escrita exige `X-CSRF-Token`: sem sessão a resposta é **401**, e o **403** de CSRF aparece
        quando há sessão (a autenticação precede a checagem de CSRF). A resposta é o
        `MaterialProprio` atualizado — o mesmo schema da leitura —, para a tela confirmar sem uma
        segunda chamada.
      operationId: editarMaterialProprio
      security:
        - SessaoCookie: []
      parameters:
        - $ref: '#/components/parameters/TokenCsrf'
        - $ref: '#/components/parameters/SlugRecurso'
      requestBody:
        required: true
        description: |-
          O conjunto editável inteiro: os cinco campos são obrigatórios, como na publicação, porque
          a tela os apresenta todos preenchidos.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdicaoDeMaterial'
            examples:
              edicaoValida:
                summary: Edição dos cinco campos editáveis
                value:
                  titulo: Introdução a algoritmos de ordenação (revisada)
                  descricao: Nota de aula sobre ordenação por comparação, com análise de complexidade, exemplos em pseudocódigo e exercícios resolvidos.
                  categoriaSlug: computacao-e-tecnologia
                  tipoSlug: nota-de-aula
                  licencaSlug: cc-by-4.0
      responses:
        '200':
          description: Metadados atualizados; `publicadoEm` preservado, `atualizadoEm` novo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialProprio'
              examples:
                materialEditado:
                  summary: Material após a edição
                  value:
                    slug: introducao-a-algoritmos-de-ordenacao
                    titulo: Introdução a algoritmos de ordenação (revisada)
                    descricao: Nota de aula sobre ordenação por comparação, com análise de complexidade, exemplos em pseudocódigo e exercícios resolvidos.
                    estado: PUBLICADO
                    categoria:
                      slug: computacao-e-tecnologia
                      nome: Computação e Tecnologia
                    tipo:
                      slug: nota-de-aula
                      nome: Nota de aula
                    licenca:
                      slug: cc-by-4.0
                      nome: CC BY 4.0
                      descricaoCurta: Você pode reutilizar e adaptar o material, inclusive comercialmente, dando crédito ao autor.
                    arquivo:
                      nomeOriginal: introducao-a-algoritmos-de-ordenacao.pdf
                      tamanhoBytes: 348160
                      disponivel: true
                    publicadoEm: '2026-10-14T15:10:00Z'
                    atualizadoEm: '2026-10-20T18:20:00Z'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroAcessoNegado'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'
        '415':
          $ref: '#/components/responses/ErroTipoNaoSuportado'
        '422':
          $ref: '#/components/responses/ErroValidacaoCampo'
        '500':
          $ref: '#/components/responses/ErroInesperado'
    patch:
      tags: [gerenciamento]
      summary: Retira do público ou repõe um material próprio
      description: |-
        Muda o estado de publicação do material próprio (RF017, RF019). O corpo é
        `TransicaoDeMaterial`: um campo, `estado`, com `RETIRADO` ou `PUBLICADO` — a transição é a
        que a máquina de estados do domínio já declara (fonte única; o contrato não inventa uma
        segunda regra, ADR-0011 §5).

        **Retirar tem efeito imediato no público** (RF019, RN002): a mesma requisição tira o material
        da listagem, da busca, do detalhe, do arquivo e do perfil do autor — a elegibilidade é
        derivada do estado persistido, não de cache.

        **Pedir o estado em que o material já está responde 200 sem escrita** — idempotente, para
        repetir o ato não virar erro de tela; `atualizadoEm` não se mexe por uma escrita que não
        aconteceu.

        **Repor no público é publicar** (ADR-0003 (b)): `RETIRADO → PUBLICADO` com conta
        `PENDENTE_VERIFICACAO` responde **403** com mensagem que diz o que falta ("confirme seu
        e-mail para republicar o material"), no mesmo formato acionável de `POST /materiais`.
        **Retirar não exige verificação** — tirar do público não coloca nada novo nele —, e nem
        editar ou excluir exigem. `publicadoEm` **não** muda na republicação; `atualizadoEm` sobe.

        **`EXCLUIDO` não entra por valor de estado**: pedir esse estado no corpo responde **422** no
        campo, com mensagem que aponta o `DELETE` — exclusão é ato próprio e terminal no MVP (RF019,
        ADR-0011 §5–§6).

        Material inexistente, de outra conta ou já `EXCLUIDO` responde o **404 indistinguível** do
        404 público, com o mesmo corpo e nenhuma escrita (ADR-0011 §3): quem repete o ato depois de
        excluir recebe 404, porque não há caminho de volta.

        A escrita exige `X-CSRF-Token`: sem sessão **401**, sem o cabeçalho (com sessão) **403**. A
        resposta é o `MaterialProprio` com o estado novo.
      operationId: retirarOuRepublicarMaterialProprio
      security:
        - SessaoCookie: []
      parameters:
        - $ref: '#/components/parameters/TokenCsrf'
        - $ref: '#/components/parameters/SlugRecurso'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransicaoDeMaterial'
            examples:
              retirada:
                summary: Retira o material do público
                value:
                  estado: RETIRADO
              republicacao:
                summary: Repõe o material no público (exige conta ATIVO)
                value:
                  estado: PUBLICADO
      responses:
        '200':
          description: |-
            Estado do material após o ato — o novo quando houve escrita, o mesmo quando o pedido era
            o estado em que ele já estava (idempotente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialProprio'
              examples:
                retirado:
                  summary: Material retirado do público
                  value:
                    slug: resumo-de-grafos
                    titulo: Resumo de grafos
                    descricao: Resumo de percurso em largura e em profundidade, com exercícios resolvidos.
                    estado: RETIRADO
                    categoria:
                      slug: computacao-e-tecnologia
                      nome: Computação e Tecnologia
                    tipo:
                      slug: slides
                      nome: Slides
                    licenca:
                      slug: todos-os-direitos-reservados
                      nome: Todos os direitos reservados
                      descricaoCurta: O material continua protegido. Ler e baixar é permitido; reutilizar não é.
                    arquivo:
                      nomeOriginal: resumo-de-grafos.pdf
                      tamanhoBytes: 204800
                      disponivel: true
                    publicadoEm: '2026-09-02T12:00:00Z'
                    atualizadoEm: '2026-10-10T18:20:00Z'
                republicado:
                  summary: Material de volta ao público — `publicadoEm` é o da primeira publicação
                  value:
                    slug: resumo-de-grafos
                    titulo: Resumo de grafos
                    descricao: Resumo de percurso em largura e em profundidade, com exercícios resolvidos.
                    estado: PUBLICADO
                    categoria:
                      slug: computacao-e-tecnologia
                      nome: Computação e Tecnologia
                    tipo:
                      slug: slides
                      nome: Slides
                    licenca:
                      slug: todos-os-direitos-reservados
                      nome: Todos os direitos reservados
                      descricaoCurta: O material continua protegido. Ler e baixar é permitido; reutilizar não é.
                    arquivo:
                      nomeOriginal: resumo-de-grafos.pdf
                      tamanhoBytes: 204800
                      disponivel: true
                    publicadoEm: '2026-09-02T12:00:00Z'
                    atualizadoEm: '2026-10-20T18:20:00Z'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroAcessoNegado'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'
        '415':
          $ref: '#/components/responses/ErroTipoNaoSuportado'
        '422':
          $ref: '#/components/responses/ErroTransicaoDeEstado'
        '500':
          $ref: '#/components/responses/ErroInesperado'
    delete:
      tags: [gerenciamento]
      summary: Exclui logicamente um material próprio
      description: |-
        Exclui o material do dono (RF017). A exclusão é **lógica** (ADR-0005 §3 (b)): o material sai
        de todas as superfícies públicas no mesmo instante — listagem, busca, detalhe, arquivo e
        perfil do autor (RF019, RN002) —, os metadados **permanecem** e o binário é **purgado 7 dias
        depois** pela rotina de retenção (card E5.5): nada é apagado do armazenamento neste ato.

        **`EXCLUIDO` é terminal no MVP** (ADR-0011 §6): não existe restauração, e repetir o `DELETE`
        no mesmo material responde **404**, como em material inexistente. É a diferença que a tela
        precisa declarar — e é por isso que a confirmação do RF017 é diálogo explícito da interface,
        que diz que não há como desfazer. A "confirmação" não é parâmetro deste contrato: um campo
        `confirmacao` no corpo não confirmaria nada, já que o cliente sempre pode enviá-lo
        (ADR-0011 §7).

        Material de outra conta ou inexistente responde o **404 indistinguível** do 404 público, sem
        escrita nenhuma (ADR-0011 §3, CA007).

        Sucesso é **204 sem corpo**. A escrita exige `X-CSRF-Token`: sem sessão **401**, sem o
        cabeçalho (com sessão) **403**.
      operationId: excluirMaterialProprio
      security:
        - SessaoCookie: []
      parameters:
        - $ref: '#/components/parameters/TokenCsrf'
        - $ref: '#/components/parameters/SlugRecurso'
      responses:
        '204':
          description: Material excluído logicamente; a resposta não tem corpo.
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroAcessoNegado'
        '404':
          $ref: '#/components/responses/ErroNaoEncontrado'
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'
        '500':
          $ref: '#/components/responses/ErroInesperado'

  /verificacao-email/reenvios:
    post:
      tags: [identidade]
      summary: Reenvia o e-mail de confirmação
      description: |
        Reenvia para o e-mail da **própria conta** o link de confirmação (ADR-0003 (c), (f), (g)).
        Não há e-mail no corpo: o destinatário vem da sessão, o que impede o endpoint de virar
        consulta de existência de conta (RNF013).

        Cooldown de **60 s** por conta: dentro dele a resposta é **429** com `Retry-After` em
        segundos — o frontend tem como contar o tempo até poder reenviar, em vez de descobrir o
        limite por tentativa e erro.

        Se o envio falhar, nada é marcado como enviado, a conta continua `PENDENTE_VERIFICACAO` e
        a resposta é **500** do contrato; o erro é registrado **sem token** (RNF017, ADR-0003 (g)).
        A tela oferece o reenvio de novo — a falha não vira muro silencioso (ADR-0003 (h)).
      operationId: reenviarVerificacaoEmail
      security:
        - SessaoCookie: []
      parameters:
        - $ref: '#/components/parameters/TokenCsrf'
      responses:
        '202':
          description: Reenvio aceito; o link sai pelo canal de e-mail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReenvioVerificacao'
              examples:
                reenviado:
                  summary: Reenvio aceito, próximo reenvio daqui a 60 s
                  value:
                    reenviadoEm: '2026-10-17T12:00:00Z'
                    podeReenviarEm: '2026-10-17T12:01:00Z'
        '401':
          $ref: '#/components/responses/ErroNaoAutenticado'
        '403':
          $ref: '#/components/responses/ErroAcessoNegado'
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'
        '429':
          $ref: '#/components/responses/ErroReenvioEmCooldown'
        '500':
          $ref: '#/components/responses/ErroInesperado'

  /verificacao-email/confirmacoes:
    post:
      tags: [identidade]
      summary: Confirma o e-mail e ativa a conta
      description: |
        Consome o token enviado por e-mail, registra a verificação e leva a conta a `ATIVO`
        (ADR-0003 (c)) — é o estado que a publicação exige (ADR-0003 (b)).

        O token vai no **corpo**, nunca no caminho: token em URL entra no log de acesso, e RNF009
        proíbe registrar token. O link do e-mail aponta para uma página do frontend, que faz esta
        chamada.

        Uso único: o token vale até ser consumido ou até expirar (24 h). Token inválido, expirado
        ou já consumido devolve o **mesmo 422**, com mensagem que não distingue os três casos nem
        revela nada sobre o token ou sobre a conta (RNF013).

        Não exige sessão: a confirmação acontece pelo link do e-mail, possivelmente em outro
        navegador e sem cookie de sessão.
      operationId: confirmarEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmacaoToken'
            examples:
              confirmacao:
                summary: Token recebido no link do e-mail
                value:
                  token: <token-omitido>
      responses:
        '204':
          description: E-mail confirmado e conta em `ATIVO`; a resposta não tem corpo.
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'
        '415':
          $ref: '#/components/responses/ErroTipoNaoSuportado'
        '422':
          $ref: '#/components/responses/ErroValidacaoCampo'
        '500':
          $ref: '#/components/responses/ErroInesperado'

  /recuperacao-senha/solicitacoes:
    post:
      tags: [identidade]
      summary: Pede o link de recuperação de acesso
      description: |
        Inicia a recuperação de senha (RF010, ADR-0003 (d)). Responde **202 sempre** — com e-mail
        cadastrado ou não, o status, o corpo e o tempo de resposta são os mesmos: é isso que
        impede o fluxo de virar consulta de existência de conta (RNF013). Quando a conta existe, o
        link sai pelo canal de e-mail; quando não existe, nada é enviado e a resposta não muda.

        Não há **429** aqui de propósito: um código de cooldown só para contas existentes seria
        exatamente a distinção que esta resposta evita. Dentro da janela de reenvio o novo pedido
        simplesmente não gera e-mail, e continua respondendo 202.

        O token gerado é de uso único, guardado hasheado (SHA-256) e vale 30 min (ADR-0003 (d)).
      operationId: solicitarRecuperacaoSenha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperacaoSolicitacao'
            examples:
              pedido:
                summary: Pedido de recuperação
                value:
                  email: maria.silva@exemplo.invalid
      responses:
        '202':
          description: |
            Pedido recebido. A resposta não tem corpo e não informa se existe conta com o e-mail
            informado (RNF013).
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'
        '415':
          $ref: '#/components/responses/ErroTipoNaoSuportado'
        '422':
          $ref: '#/components/responses/ErroValidacaoCampo'
        '500':
          $ref: '#/components/responses/ErroInesperado'

  /recuperacao-senha/confirmacoes:
    post:
      tags: [identidade]
      summary: Redefine a senha com o token de recuperação
      description: |
        Conclui a recuperação (RF010, ADR-0003 (d)): consome o token de uso único, troca a senha
        (bcrypt 12) e **invalida todas as sessões abertas da conta** — quem trocou a senha por
        recuperação não pode seguir logado por um cookie antigo (RNF012).

        O token vai no corpo, nunca no caminho (RNF009). Token inválido, expirado ou já consumido
        → **422**, sem distinguir os casos nem revelar dado da conta. Senha nova fora do intervalo
        → **422** no campo `novaSenha`.

        Não exige sessão (o segredo é o token) nem `X-CSRF-Token`.
      operationId: confirmarRecuperacaoSenha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperacaoConfirmacao'
            examples:
              redefinicao:
                summary: Token do e-mail e senha nova
                value:
                  token: <token-omitido>
                  novaSenha: nova-senha-2026
      responses:
        '204':
          description: Senha redefinida e sessões anteriores invalidadas; a resposta não tem corpo.
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'
        '415':
          $ref: '#/components/responses/ErroTipoNaoSuportado'
        '422':
          $ref: '#/components/responses/ErroValidacaoCampo'
        '500':
          $ref: '#/components/responses/ErroInesperado'

components:
  securitySchemes:
    SessaoCookie:
      type: apiKey
      in: cookie
      name: SCIPATH_SESSAO
      description: |
        Sessão do usuário: opaca, mantida no servidor **em tabela no PostgreSQL** e revogável. A
        cookie é `HttpOnly` (o JavaScript do frontend não a lê), `Secure` e `SameSite=Lax`, com
        `Path=/`. Expira por inatividade em **12 h** e de forma absoluta em **7 dias**; passado o
        prazo, a requisição seguinte com o mesmo cookie responde **401**. O frontend não guarda
        nada dela — chama a API na mesma origem e deixa o cookie viajar (ADR-0003 (e)).

  parameters:
    FiltroAtivo:
      name: ativo
      in: query
      required: false
      description: |
        Filtra por estado ativo do item de referência. Omitido, devolve apenas itens
        ativos; `false` inclui também os desativados (desativar taxonomia é migração
        Flyway — ADR-0006).
      schema:
        type: boolean
        default: true
      example: true

    NumeroPagina:
      name: page
      in: query
      required: false
      description: Número da página, começando em 0.
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0

    TamanhoPagina:
      name: size
      in: query
      required: false
      description: Itens por página. Teto de 100 por requisição (RNF021).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20

    FiltroBusca:
      name: q
      in: query
      required: false
      description: |
        Busca lexical sobre `titulo` e `descricao` do material (RF003, §12.1). Resistente a
        acento e caixa: "matemática" e "matematica" casam o mesmo conjunto. Ausente ou vazia
        não é erro — devolve a listagem padrão (RF003). Não há ordenação nem promessa de
        relevância: o resultado sai na ordenação pedida por `ordem` (§12.2). Caracteres
        especiais são tratados como texto, nunca como operador (§12.1). Termo acima do teto
        de `maxLength` é recusado com **400** (ADR-0008): cortar em silêncio mudaria o
        resultado sem o cliente saber.
      schema:
        type: string
        maxLength: 200
      example: algoritmos de ordenação

    FiltroCategoria:
      name: categoria
      in: query
      required: false
      description: |
        Filtra por `slug` da categoria do material (RF004). O valor é o `slug` estável
        devolvido em `categoria.slug` (ADR-0006, RF007) — não o `nome`. Slug bem formado mas
        inexistente devolve **200 vazio**, nunca 404; valor fora do formato de slug devolve
        **400** no `ProblemDetail` padrão.
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      example: computacao-e-tecnologia

    FiltroTipo:
      name: tipo
      in: query
      required: false
      description: |
        Filtra por `slug` do tipo de material (RF004). Mesmo contrato do filtro de
        categoria: `slug` estável, desconhecido → 200 vazio, mal formado → 400.
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      example: nota-de-aula

    OrdemMateriais:
      name: ordem
      in: query
      required: false
      description: |
        Critério de ordenação da listagem (§12.2). `recentes` (padrão) ordena por
        `publicadoEm` decrescente com desempate **estável** por `id`; `titulo` ordena por
        `titulo` crescente com o mesmo desempate por `id` — em ambos, a ordem total é
        determinística, então paginar não duplica nem omite item (RN013). O título é
        comparado por ponto de código (`COLLATE "C"`, ADR-0010): a ordem publicada não
        muda com a collation do banco. Não existe ordem
        por "relevância" nem por contagem de popularidade (§12.2, §12.4). Valor fora do
        enum → **400**.
      schema:
        type: string
        enum: [recentes, titulo]
        default: recentes
      example: recentes

    SlugRecurso:
      name: slug
      in: path
      required: true
      description: |
        Identificador público do recurso — o `slug` estável do material ou do perfil
        (RN009, RNF025). Valor fora do formato de slug → 400; slug bem formado que não
        existe (ou não é público) → 404.
      schema:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
        maxLength: 120
      example: introducao-a-algoritmos-de-ordenacao

    TokenCsrf:
      name: X-CSRF-Token
      in: header
      required: true
      description: |
        Token CSRF da sessão corrente, exigido em toda escrita — cadastro, login, logout, editar
        perfil, reenvio de verificação e publicação de material. O servidor o emite na cookie
        `XSRF-TOKEN`, legível pelo frontend da mesma origem (ao contrário da cookie de sessão), e
        o cliente devolve o valor neste cabeçalho; a primeira leitura do app já traz a cookie.
        Ausente ou sem correspondência com a sessão → **403** `acesso_negado`. Numa escrita que
        exige identidade e chega **sem sessão**, a resposta é **401**: a autenticação precede a
        checagem de CSRF.
        As confirmações por token (verificação de e-mail, recuperação de senha) não exigem o
        cabeçalho: o segredo vai no corpo e não há cookie de sessão em jogo.
      schema:
        type: string
      example: 8bd0f2c1a94e4d7f8b6c5a3e2f1d0c9b

  responses:
    ErroValidacao:
      description: |
        O servidor não conseguiu processar o pedido como veio: valor recusado em parâmetro de
        consulta ou de caminho, ou corpo ausente/ilegível. Campo de **corpo** com valor inválido
        não é este erro — é **422** `validacao_campo`. Quando dá para apontar o parâmetro culpado,
        a resposta traz `errors[]`; corpo ilegível não tem campo e vem sem a lista.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            parametroInvalido:
              summary: Parâmetro de consulta inválido
              value:
                type: urn:scipath:erro:validacao
                title: Requisição inválida
                status: 400
                detail: O parâmetro 'ativo' deve ser true ou false.
                instance: /api/categorias
                errors:
                  - campo: ativo
                    mensagem: deve ser true ou false

    ErroNaoEncontrado:
      description: |
        Recurso ausente ou não público. A resposta é a mesma para material inexistente,
        material RETIRADO ou EXCLUIDO e perfil de conta não ATIVA — de propósito, para não
        revelar a existência de conteúdo fora do público (RN002, CA008). Sem `errors[]`:
        recurso ausente não é erro de campo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            recursoForaDoPublico:
              summary: Material inexistente ou não público
              value:
                type: urn:scipath:erro:nao_encontrado
                title: Recurso não encontrado
                status: 404
                detail: O recurso solicitado não foi encontrado.
                instance: /api/materiais/exemplo-material-fora-do-publico

    ErroMetodoNaoPermitido:
      description: |
        Método HTTP não aceito neste endereço. O endereço existe, mas não responde a este
        método; `detail` diz qual usar. Sem `errors[]`: método não é campo, e o contrato
        reserva `errors[]` para erro de campo (RNF004 põe a orientação no `detail`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            metodoErrado:
              summary: POST num endpoint de leitura
              value:
                type: urn:scipath:erro:metodo_nao_permitido
                title: Método não permitido
                status: 405
                detail: O método POST não é aceito neste endereço. Use GET.
                instance: /api/categorias

    ErroInesperado:
      description: |
        Falha interna. A resposta não carrega stack trace, SQL nem caminho de arquivo
        (RNF012); o detalhe técnico fica apenas no log do servidor.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            falhaInterna:
              summary: Erro interno
              value:
                type: urn:scipath:erro:interno
                title: Erro interno
                status: 500
                detail: Não foi possível concluir a operação. Tente novamente.
                instance: /api/categorias

    ErroNaoAutenticado:
      description: |
        A operação exige identidade e não há sessão válida — ausente, expirada por inatividade
        (12 h) ou pelo limite absoluto (7 dias), ou revogada no logout. O mesmo 401 vale para
        e-mail inexistente e senha errada no login: a resposta não diz qual campo falhou nem se a
        conta existe (RNF013). Sem `errors[]` — não há campo a apontar.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            semSessao:
              summary: Requisição a rota privada sem sessão
              value:
                type: urn:scipath:erro:nao_autenticado
                title: Não autenticado
                status: 401
                detail: É necessário entrar na conta para esta operação.
                instance: /api/perfil/atual
            credenciaisInvalidas:
              summary: Login com credenciais inválidas (corpo idêntico para e-mail inexistente)
              value:
                type: urn:scipath:erro:nao_autenticado
                title: Não autenticado
                status: 401
                detail: E-mail ou senha inválidos.
                instance: /api/sessoes

    ErroAcessoNegado:
      description: |
        Há identidade, mas a operação não é permitida — ou falta o `X-CSRF-Token` na escrita. No
        login, conta `SUSPENSO` com credenciais corretas também responde este 403: quem provou ser
        o dono tem o direito de saber por que não entra. Na publicação, conta
        `PENDENTE_VERIFICACAO` responde este 403 (ADR-0003 (b)) — o `detail` diz que falta
        confirmar o e-mail, para a tela oferecer o reenvio em vez de um erro cru. Na **republicação**
        de material próprio (v0.6.0), vale a mesma regra, pela mesma razão: repor material no
        público é publicar. Sem `errors[]`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            csrfAusente:
              summary: Escrita sem o token CSRF
              value:
                type: urn:scipath:erro:acesso_negado
                title: Acesso negado
                status: 403
                detail: Falta o cabeçalho 'X-CSRF-Token' ou ele não corresponde à sessão corrente.
                instance: /api/perfil/atual
            contaSuspensa:
              summary: Login em conta suspensa, com credenciais corretas
              value:
                type: urn:scipath:erro:acesso_negado
                title: Acesso negado
                status: 403
                detail: Esta conta está suspensa e não pode entrar.
                instance: /api/sessoes
            emailNaoVerificado:
              summary: Publicação com e-mail ainda não confirmado
              value:
                type: urn:scipath:erro:acesso_negado
                title: Acesso negado
                status: 403
                detail: Confirme seu e-mail para publicar material.
                instance: /api/materiais
            republicacaoSemVerificacao:
              summary: Republicação de material próprio com e-mail ainda não confirmado
              value:
                type: urn:scipath:erro:acesso_negado
                title: Acesso negado
                status: 403
                detail: Confirme seu e-mail para republicar o material.
                instance: /api/perfil/atual/materiais/resumo-de-grafos

    ErroConflitoUnicidade:
      description: |
        O valor enviado já pertence a outro registro — e-mail já cadastrado (RF008, RN009) ou
        `slug` de perfil já em uso (RN009). Traz `errors[]` com o campo em conflito, porque um
        formulário precisa apontar o campo culpado. É o **único** caso em que o contrato admite
        revelar que existe conta com determinado e-mail: no cadastro, dizê-lo é o que torna o
        formulário útil. Login e recuperação nunca fazem essa distinção (RNF013).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            emailEmUso:
              summary: Cadastro com e-mail já cadastrado
              value:
                type: urn:scipath:erro:conflito_de_unicidade
                title: Conflito de unicidade
                status: 409
                detail: Já existe conta com este e-mail.
                instance: /api/contas
                errors:
                  - campo: email
                    mensagem: já está em uso
            slugEmUso:
              summary: Edição de perfil com slug já em uso
              value:
                type: urn:scipath:erro:conflito_de_unicidade
                title: Conflito de unicidade
                status: 409
                detail: Este identificador público já está em uso.
                instance: /api/perfil/atual
                errors:
                  - campo: slug
                    mensagem: já está em uso

    ErroArquivoMuitoGrande:
      description: |
        O arquivo enviado excede o limite de upload (RF013, ADR-0005 §1). O limite **não é
        constante**: é configuração (`SCIPATH_UPLOAD_MAX_BYTES`, 30 MB por padrão), e a mensagem
        diz o valor corrente ("arquivo acima de X MB") — nunca um 500 genérico (RNF004). Sem
        `errors[]`: o arquivo não é campo de corpo, e o motivo está no `detail`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            arquivoGrande:
              summary: Publicação com arquivo acima do limite
              value:
                type: urn:scipath:erro:arquivo_muito_grande
                title: Arquivo muito grande
                status: 413
                detail: O arquivo excede o limite de 30 MB.
                instance: /api/materiais

    ErroTipoNaoSuportado:
      description: |
        O `Content-Type` da requisição não é aceito. As escritas deste contrato recebem
        `application/json`; a publicação de material (`POST /materiais`) recebe
        `multipart/form-data`. Nessa rota o 415 também cobre o **arquivo** cujo conteúdo não é PDF
        válido — PDF renomeado ou MIME mentindo (RF013, ADR-0005 §1): a extensão nunca decide
        sozinha. Sem `errors[]` — `Content-Type` não é campo, e o formato recusado é explicado no
        `detail`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            tipoErrado:
              summary: Escrita com Content-Type não suportado
              value:
                type: urn:scipath:erro:tipo_nao_suportado
                title: Tipo de mídia não suportado
                status: 415
                detail: Este endpoint recebe 'application/json'.
                instance: /api/contas
            arquivoNaoPdf:
              summary: Publicação com arquivo que não é PDF válido
              value:
                type: urn:scipath:erro:tipo_nao_suportado
                title: Tipo de mídia não suportado
                status: 415
                detail: O arquivo enviado não é um PDF válido.
                instance: /api/materiais

    ErroValidacaoCampo:
      description: |
        O corpo foi lido e um campo tem valor inválido — e-mail fora do formato, senha fora do
        intervalo, `slug` fora do padrão, token de confirmação inválido, expirado ou já
        consumido. Na publicação, também é este 422: `categoriaSlug`, `tipoSlug` ou `licencaSlug`
        inexistente (ou inativo) e `declaracaoDireito` ausente ou `false` (RF012, RF018). Traz
        `errors[]` com o campo culpado. É o código do formulário: o 400 fica para o pedido que o
        servidor não conseguiu processar como veio (consulta/caminho inválido, corpo ilegível).

        No token de confirmação, a mensagem é a mesma para inválido, expirado e já consumido, e
        não revela nada sobre o token nem sobre a conta (RNF013).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            emailInvalido:
              summary: Cadastro com e-mail fora do formato
              value:
                type: urn:scipath:erro:validacao_campo
                title: Campo inválido
                status: 422
                detail: Um ou mais campos do corpo não foram aceitos.
                instance: /api/contas
                errors:
                  - campo: email
                    mensagem: deve ser um endereço de e-mail válido
            senhaForaDoIntervalo:
              summary: Cadastro com senha fora do intervalo
              value:
                type: urn:scipath:erro:validacao_campo
                title: Campo inválido
                status: 422
                detail: Um ou mais campos do corpo não foram aceitos.
                instance: /api/contas
                errors:
                  - campo: senha
                    mensagem: deve ter entre 8 e 72 caracteres
            tokenDeConfirmacaoInvalido:
              summary: Token inválido, expirado ou já consumido (corpo idêntico nos três casos)
              value:
                type: urn:scipath:erro:validacao_campo
                title: Campo inválido
                status: 422
                detail: Um ou mais campos do corpo não foram aceitos.
                instance: /api/verificacao-email/confirmacoes
                errors:
                  - campo: token
                    mensagem: token inválido ou expirado
            categoriaInexistente:
              summary: Publicação com categoria que não existe
              value:
                type: urn:scipath:erro:validacao_campo
                title: Campo inválido
                status: 422
                detail: Um ou mais campos do corpo não foram aceitos.
                instance: /api/materiais
                errors:
                  - campo: categoriaSlug
                    mensagem: categoria inexistente ou inativa
            direitoNaoDeclarado:
              summary: Publicação sem confirmar o direito de compartilhar
              value:
                type: urn:scipath:erro:validacao_campo
                title: Campo inválido
                status: 422
                detail: Um ou mais campos do corpo não foram aceitos.
                instance: /api/materiais
                errors:
                  - campo: declaracaoDireito
                    mensagem: é preciso confirmar que você tem o direito de compartilhar o material

    ErroTransicaoDeEstado:
      description: |-
        O corpo de `PATCH /perfil/atual/materiais/{slug}` traz `estado` fora do que o ato aceita.
        `EXCLUIDO` é recusado aqui de propósito: exclusão é o `DELETE`, ato próprio e terminal no MVP
        (RF019, ADR-0011 §5), e a mensagem do campo diz isso. É a MESMA classe de erro do 422 de
        campo — `urn:scipath:erro:validacao_campo` —, com `errors[]` apontando `estado`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            exclusaoPorEstado:
              summary: Tentativa de excluir por valor de estado
              value:
                type: urn:scipath:erro:validacao_campo
                title: Campo inválido
                status: 422
                detail: Um ou mais campos do corpo não foram aceitos.
                instance: /api/perfil/atual/materiais/resumo-de-grafos
                errors:
                  - campo: estado
                    mensagem: a exclusão é a operação DELETE; este campo aceita PUBLICADO ou RETIRADO
            estadoForaDoEnum:
              summary: Valor de estado que não existe
              value:
                type: urn:scipath:erro:validacao_campo
                title: Campo inválido
                status: 422
                detail: Um ou mais campos do corpo não foram aceitos.
                instance: /api/perfil/atual/materiais/resumo-de-grafos
                errors:
                  - campo: estado
                    mensagem: deve ser PUBLICADO ou RETIRADO

    ErroReenvioEmCooldown:
      description: |
        Reenvio de verificação pedido antes de passar o cooldown de 60 s (ADR-0003 (c)). Não é
        erro de campo: o pedido está correto, só chegou cedo — por isso não traz `errors[]`. O
        cabeçalho `Retry-After` informa em quantos segundos o reenvio volta a ser aceito.

        É o **único** 429 deste contrato. A solicitação de recuperação não o usa: um cooldown que
        só aparecesse para contas existentes revelaria a existência da conta (RNF013).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            reenvioCedo:
              summary: Reenvio dentro do cooldown
              value:
                type: urn:scipath:erro:reenvio_em_cooldown
                title: Reenvio em cooldown
                status: 429
                detail: Aguarde antes de pedir um novo e-mail de verificação.
                instance: /api/verificacao-email/reenvios
      headers:
        Retry-After:
          description: Segundos até o próximo reenvio ser aceito.
          schema:
            type: integer
            minimum: 1
          example: 42

  schemas:
    EstadoApi:
      type: object
      description: Estado operacional da API (RF022).
      required: [status, version, database]
      properties:
        status:
          type: string
          enum: [UP, DEGRADED]
          description: UP quando API e banco respondem; DEGRADED quando a API responde e o banco não.
          example: UP
        version:
          type: string
          description: Versão do contrato em execução.
          example: 0.2.0
        database:
          type: string
          enum: [UP, DOWN]
          description: Alcance do banco de dados.
          example: UP

    Categoria:
      type: object
      description: Categoria científica de referência (ADR-0006).
      required: [id, slug, nome, descricao, ativo]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador interno; o cliente não deriva significado dele.
          example: 3f2c1a90-5b7e-4c21-9a11-8e0d2f6b7c44
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Chave estável da categoria; é o valor que o cliente guarda e envia.
          example: computacao-e-tecnologia
        nome:
          type: string
          description: Rótulo de exibição; pode mudar sem quebrar dados.
          example: Computação e Tecnologia
        descricao:
          type: string
          description: Descrição curta, para descoberta e SEO (DRS §12).
          example: Software, dados, redes, inteligência artificial e demais áreas da computação.
        ativo:
          type: boolean
          description: Item de referência ativo; inativos só aparecem com `ativo=false`.
          example: true

    TipoMaterial:
      type: object
      description: Tipo de material de referência (ADR-0006).
      required: [id, slug, nome, ativo]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador interno; o cliente não deriva significado dele.
          example: 1c9e5a30-7d24-4f61-8b02-2a6f1d3e9c05
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Chave estável do tipo; é o valor que o cliente guarda e envia.
          example: nota-de-aula
        nome:
          type: string
          description: Rótulo de exibição; pode mudar sem quebrar dados.
          example: Nota de aula
        ativo:
          type: boolean
          description: Item de referência ativo; inativos só aparecem com `ativo=false`.
          example: true

    Licenca:
      type: object
      description: Licença de reutilização de referência (ADR-0006, RN006).
      required: [id, slug, nome, descricaoCurta, ativo]
      properties:
        id:
          type: string
          format: uuid
          description: Identificador interno; o cliente não deriva significado dele.
          example: 9a7d3c16-4e80-4b95-a173-0f5c8e2b6d47
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9.]+)*$'
          description: Chave estável da licença; é o valor que o cliente guarda e envia.
          example: cc-by-4.0
        nome:
          type: string
          description: Rótulo de exibição da licença.
          example: CC BY 4.0
        identificador:
          type: string
          description: |
            Identificador público da licença (ex.: SPDX). Ausente quando a licença não
            tem identificador público ("Todos os direitos reservados").
          example: CC-BY-4.0
        urlReferencia:
          type: string
          format: uri
          description: |
            URL do texto de referência da licença. Ausente quando não existe texto
            público ("Todos os direitos reservados").
          example: https://creativecommons.org/licenses/by/4.0/
        descricaoCurta:
          type: string
          description: Explicação em linguagem simples do que a licença permite (RN006).
          example: Você pode reutilizar e adaptar o material, inclusive comercialmente, dando crédito ao autor.
        ativo:
          type: boolean
          description: Item de referência ativo; inativos só aparecem com `ativo=false`.
          example: true

    Pagina:
      type: object
      description: |
        Envelope padrão de lista paginada (RF002, RNF021). Toda listagem responde
        exatamente estes quatro campos; o endpoint especializa `items` no schema do
        recurso (`PaginaCategorias`, `PaginaTiposMaterial`, `PaginaLicencas`,
        `PaginaMateriais`). `page` começa em 0, `size` tem teto por requisição e a
        ordenação do endpoint é estável, para que páginas não repitam nem pulem itens.
      required: [items, page, size, total]
      properties:
        items:
          type: array
          description: Itens da página corrente.
          items: {}
        page:
          type: integer
          minimum: 0
          description: Número da página corrente, começando em 0.
          example: 0
        size:
          type: integer
          minimum: 1
          description: Itens solicitados por página.
          example: 20
        total:
          type: integer
          minimum: 0
          description: Total de itens que atendem à consulta, independente da página.
          example: 13
      example:
        items:
          - id: 3f2c1a90-5b7e-4c21-9a11-8e0d2f6b7c44
            slug: computacao-e-tecnologia
            nome: Computação e Tecnologia
            descricao: Software, dados, redes, inteligência artificial e demais áreas da computação.
            ativo: true
        page: 0
        size: 20
        total: 13

    PaginaCategorias:
      description: Envelope de paginação (ver `Pagina`) com categorias em `items`.
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Categoria'

    PaginaTiposMaterial:
      description: Envelope de paginação (ver `Pagina`) com tipos de material em `items`.
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/TipoMaterial'

    PaginaLicencas:
      description: Envelope de paginação (ver `Pagina`) com licenças em `items`.
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Licenca'

    CategoriaRef:
      type: object
      description: |
        Categoria de referência anexada a um material (dados do ADR-0006), reduzida ao que
        a descoberta precisa exibir e navegar. O cliente usa `slug` para filtrar e para
        linkar a página da categoria (RF007); `nome` é só rótulo de exibição.
      required: [slug, nome]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Chave estável da categoria; é o mesmo valor aceito pelo filtro `categoria`.
          example: computacao-e-tecnologia
        nome:
          type: string
          description: Rótulo de exibição da categoria.
          example: Computação e Tecnologia

    TipoMaterialRef:
      type: object
      description: |
        Tipo de material anexado a um material (dados do ADR-0006), reduzido ao necessário
        para exibir e filtrar. `slug` é a chave estável aceita pelo filtro `tipo`.
      required: [slug, nome]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Chave estável do tipo; é o mesmo valor aceito pelo filtro `tipo`.
          example: nota-de-aula
        nome:
          type: string
          description: Rótulo de exibição do tipo.
          example: Nota de aula

    LicencaRef:
      type: object
      description: |
        Licença de reutilização do material, sempre explícita (RN006). `descricaoCurta` é
        obrigatória porque é ela que impede a leitura errada de que "estar público" significa
        domínio público (§13.2); a resposta nunca traz só o nome da licença.
      required: [slug, nome, descricaoCurta]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9.]+)*$'
          description: Chave estável da licença.
          example: cc-by-4.0
        nome:
          type: string
          description: Rótulo de exibição da licença.
          example: CC BY 4.0
        identificador:
          type: string
          description: |
            Identificador público da licença (ex.: SPDX). Ausente quando a licença não tem
            identificador público ("Todos os direitos reservados").
          example: CC-BY-4.0
        urlReferencia:
          type: string
          format: uri
          description: |
            URL do texto de referência da licença. Ausente quando não há texto público
            ("Todos os direitos reservados").
          example: https://creativecommons.org/licenses/by/4.0/
        descricaoCurta:
          type: string
          description: Explicação em linguagem simples do que a licença permite e do que não permite (RN006).
          example: Você pode reutilizar e adaptar o material, inclusive comercialmente, dando crédito ao autor.

    AutorResumo:
      type: object
      description: |
        Identidade pública do autor na listagem — o mínimo para exibir no card e linkar o
        perfil (RF002, RF007). Nunca carrega e-mail, conta, hash ou token (RNF013).
      required: [slug, nomePublico]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Slug público do perfil; é o valor da rota `/autores/{slug}` (RNF025).
          example: maria-silva
        nomePublico:
          type: string
          description: Nome público exibido como autor do material.
          example: Maria Silva

    MaterialResumo:
      type: object
      description: |
        Item de material na descoberta pública (RF002). Todo material devolvido está
        PUBLICADO e pertence a conta ATIVA (RN002, §11.3): `estado` não é campo porque,
        nesta superfície, ele é sempre PUBLICADO — material retirado ou excluído
        simplesmente não aparece. Licença sempre presente (RN006). Sem marca de revisão,
        certificação, curadoria ou verificação (RN010, RN011).
      required: [slug, titulo, descricao, autor, categoria, tipo, licenca, publicadoEm]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Identificador público e estável do material; é o valor da rota `/materiais/{slug}` (RNF025).
          example: introducao-a-algoritmos-de-ordenacao
        titulo:
          type: string
          description: Título do material (RN004). É o `title` de SEO na página do material.
          example: Introdução a algoritmos de ordenação
        descricao:
          type: string
          description: Descrição curta do material (RN004). É a base do `description` de SEO.
          example: Nota de aula sobre ordenação por comparação, com análise de complexidade e exemplos em pseudocódigo.
        autor:
          $ref: '#/components/schemas/AutorResumo'
        categoria:
          $ref: '#/components/schemas/CategoriaRef'
        tipo:
          $ref: '#/components/schemas/TipoMaterialRef'
        licenca:
          $ref: '#/components/schemas/LicencaRef'
        publicadoEm:
          type: string
          format: date-time
          description: Instante da publicação; chave da ordenação padrão `recentes` (§12.2).
          example: '2026-10-14T15:10:00Z'
        atualizadoEm:
          type: string
          format: date-time
          description: Última atualização do material. Presente quando difere da publicação.
          example: '2026-10-15T09:00:00Z'

    MaterialDetalhe:
      type: object
      description: |
        Material público completo (RF005): autoria, categoria, tipo, licença explicada, estado
        de publicação e o metadado do arquivo para download (RF014). Nenhum dado privado — não
        há e-mail, hash, token, chave de storage, caminho interno nem identificador de conta
        (RNF013, RNF014). Nenhuma marca de revisão, certificação, curadoria ou verificação
        científica (RN010, RN011, CA012).

        `arquivo` traz só o que a tela precisa para oferecer o download — nome original
        sanitizado, tamanho e disponibilidade. O endereço interno do arquivo nunca aparece:
        quem decide o acesso é `GET /materiais/{slug}/arquivo`, no servidor (RF014, RNF014).
      required: [slug, titulo, descricao, autor, categoria, tipo, licenca, arquivo, estado, publicadoEm, atualizadoEm]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Identificador público e estável do material; base da URL canônica (RNF025).
          example: introducao-a-algoritmos-de-ordenacao
        titulo:
          type: string
          description: Título do material (RN004). É o `title` de SEO da página.
          example: Introdução a algoritmos de ordenação
        descricao:
          type: string
          description: Descrição do material (RN004). É o `description` de SEO da página.
          example: Nota de aula sobre ordenação por comparação, com análise de complexidade e exemplos em pseudocódigo.
        autor:
          $ref: '#/components/schemas/AutorResumo'
        categoria:
          $ref: '#/components/schemas/CategoriaRef'
        tipo:
          $ref: '#/components/schemas/TipoMaterialRef'
        licenca:
          $ref: '#/components/schemas/LicencaRef'
        arquivo:
          $ref: '#/components/schemas/ArquivoMaterial'
        estado:
          type: string
          enum: [PUBLICADO]
          description: |
            Estado de publicação. Nesta superfície é sempre `PUBLICADO`: material RETIRADO
            ou EXCLUIDO responde 404, indistinguível de inexistente (RN002, CA008).
          example: PUBLICADO
        publicadoEm:
          type: string
          format: date-time
          description: Instante da publicação.
          example: '2026-10-14T15:10:00Z'
        atualizadoEm:
          type: string
          format: date-time
          description: Instante da última atualização (RF005).
          example: '2026-10-14T15:10:00Z'

    ArquivoMaterial:
      type: object
      description: |
        Metadado público do arquivo do material (RF014), o necessário para a tela oferecer o
        download sem revelar infraestrutura. Não há caminho, chave de storage, checksum nem
        credencial: o download é decidido no servidor por `GET /materiais/{slug}/arquivo`
        (RF014, RNF014).
      required: [nomeOriginal, tamanhoBytes, disponivel]
      properties:
        nomeOriginal:
          type: string
          description: |
            Nome original do arquivo, sanitizado — é o nome sugerido no download
            (`Content-Disposition`). O nome físico no storage é uma chave interna e nunca aparece.
          example: introducao-a-algoritmos-de-ordenacao.pdf
        tamanhoBytes:
          type: integer
          minimum: 0
          description: Tamanho do arquivo em bytes.
          example: 348160
        disponivel:
          type: boolean
          description: |
            `true` quando o arquivo está acessível agora para download. `false` permite à tela não
            oferecer um link que responderia 404; a razão nunca é exposta.
          example: true

    PublicacaoMaterial:
      type: object
      description: |
        Metadados e arquivo de uma publicação (RF012, §8.3), enviados juntos em
        `multipart/form-data`. **Não existe campo de autor, de conta ou de perfil**: a autoria vem
        da sessão (ADR-0003 (j)). `categoriaSlug`, `tipoSlug` e `licencaSlug` são os `slug`
        estáveis da taxonomia (ADR-0006, RF018) — os mesmos valores que a leitura devolve.
      required: [titulo, descricao, categoriaSlug, tipoSlug, licencaSlug, arquivo, declaracaoDireito]
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 200
          description: Título do material (RN004); é o `title` de SEO da página.
          example: Introdução a algoritmos de ordenação
        descricao:
          type: string
          minLength: 1
          maxLength: 2000
          description: Descrição do material (RN004); é a base do `description` de SEO.
          example: Nota de aula sobre ordenação por comparação, com análise de complexidade e exemplos em pseudocódigo.
        categoriaSlug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: |
            `slug` da categoria do material (RF018). Precisa existir e estar ativa; inexistente ou
            inativa → 422 no campo.
          example: computacao-e-tecnologia
        tipoSlug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: |
            `slug` do tipo de material (RF018). Precisa existir e estar ativo; inexistente ou
            inativo → 422 no campo.
          example: nota-de-aula
        licencaSlug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9.]+)*$'
          description: |
            `slug` da licença de reutilização (RF018, RN006). Precisa existir e estar ativa;
            nenhuma licença é atribuída automaticamente — o autor escolhe. Inexistente ou inativa
            → 422 no campo.
          example: cc-by-4.0
        arquivo:
          type: string
          format: binary
          description: |
            Conteúdo do arquivo, na mesma requisição dos metadados (RF012, RN008). Precisa ser PDF
            válido por conteúdo (RF013): formato recusado → 415; acima do limite → 413.
        declaracaoDireito:
          type: boolean
          description: |
            Confirmação de que o autor possui o direito de compartilhar o material (RF012).
            Obrigatório e precisa ser `true`; ausente ou `false` → 422 no campo.
          example: true

    MaterialPublicado:
      type: object
      description: |
        Resultado de uma publicação (RF012). O `slug` é gerado no servidor, único e estável
        (RNF025); `estado` é o estado de publicação (o nome da coluna no banco,
        `estado_publicacao`, não aparece no contrato); `urlPublica` é o caminho da página pública
        do material.
      required: [slug, estado, urlPublica]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Identificador público e estável do material; base da URL canônica (RNF025).
          example: introducao-a-algoritmos-de-ordenacao
        estado:
          type: string
          enum: [PUBLICADO]
          description: Estado de publicação após o sucesso; a publicação nasce `PUBLICADO` (RF019).
          example: PUBLICADO
        urlPublica:
          type: string
          pattern: '^/materiais/[a-z0-9]+(-[a-z0-9]+)*$'
          description: |
            Caminho da página pública do material no frontend (RF012, RNF025). É derivado do
            `slug`, é estável e o cliente navega para ele diretamente — o contrato não inventa um
            host nem expõe rota de API.
          example: /materiais/introducao-a-algoritmos-de-ordenacao

    MaterialProprio:
      type: object
      description: |-
        Material do próprio dono, na visão de gerenciamento (RF015). É o **mesmo** schema no item da
        lista e no detalhe: o dono precisa dos mesmos campos nos dois, e dois schemas para a mesma
        coisa divergiriam com o tempo (ADR-0011 §2).

        **Sem `autor`.** A autoria é sempre o perfil da sessão (RN001); devolver o dono como autor de
        si mesmo seria um campo com um valor só. É também por isso que o ADR-0011 descarta reusar
        `MaterialResumo`/`MaterialDetalhe` aqui: os dois carregam `autor` e declaram `estado` apenas
        como `PUBLICADO`.

        **Os três estados aparecem** — `PUBLICADO`, `RETIRADO` e `EXCLUIDO` (RF015,
        PAGE_BLUEPRINTS §12): esta é a visão do dono, não a do público, e ela não esconde o que ele
        acabou de excluir.

        Nenhum dado privado (RNF013): fora do schema ficam e-mail de login, hash de senha, token,
        identificador de conta, vínculo de perfil e chave de armazenamento (RNF014). A licença
        continua explícita, com o que ela permite (`LicencaRef`, RN006) — estar público não significa
        domínio público, e a explicação não some porque quem lê é o dono.
      required: [slug, titulo, descricao, estado, categoria, tipo, licenca, arquivo, publicadoEm, atualizadoEm]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: |-
            Identificador público e estável do material (RNF025). É a chave da URL canônica pública
            e **não muda** por esta superfície: editar metadados não troca o endereço.
          example: introducao-a-algoritmos-de-ordenacao
        titulo:
          type: string
          description: Título do material (RN004). Editável pelo dono (RF016).
          example: Introdução a algoritmos de ordenação
        descricao:
          type: string
          description: Descrição do material (RN004). Editável pelo dono (RF016).
          example: Nota de aula sobre ordenação por comparação, com análise de complexidade e exemplos em pseudocódigo.
        estado:
          type: string
          enum: [PUBLICADO, RETIRADO, EXCLUIDO]
          description: |-
            Estado de publicação. Só `PUBLICADO` é elegível à descoberta, à busca e ao download
            (RN002, RF019); `RETIRADO` é reversível pelo dono (o `PATCH` o repõe no público) e
            `EXCLUIDO` é **terminal** no MVP — não há restauração (ADR-0011 §6). As ações do dono
            valem em `PUBLICADO` e `RETIRADO`; em `EXCLUIDO`, nenhuma (ADR-0011 §2).
          example: PUBLICADO
        categoria:
          $ref: '#/components/schemas/CategoriaRef'
        tipo:
          $ref: '#/components/schemas/TipoMaterialRef'
        licenca:
          $ref: '#/components/schemas/LicencaRef'
        arquivo:
          $ref: '#/components/schemas/ArquivoMaterial'
        publicadoEm:
          type: string
          format: date-time
          description: |-
            Instante da publicação. **Não muda** por edição nem por republicação — é a âncora da
            ordenação pública `recentes`, e reescrevê-la faria de retirar/republicar uma manobra para
            subir ao topo da listagem (ADR-0011 §4).
          example: '2026-10-14T15:10:00Z'
        atualizadoEm:
          type: string
          format: date-time
          description: |-
            Instante da última escrita que alterou o material — edição, retirada, republicação ou
            exclusão. Não sobe quando a escrita não acontece (pedir o estado em que o material já
            está responde 200 sem gravar). Ordena a lista do dono, `atualizadoEm` DESC.
          example: '2026-10-20T18:20:00Z'

    PaginaMateriaisProprios:
      description: Envelope de paginação (ver `Pagina`) com os materiais do dono em `items`.
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MaterialProprio'

    PerfilPublico:
      type: object
      description: |
        Identidade pública de uma conta (RF006, DRS §11.1.2), sem os materiais. É o schema do
        perfil do próprio usuário, devolvido por `PUT /perfil/atual`, e a parte de identidade do
        perfil público do autor (`AutorPublico`) — um só lugar descreve os campos públicos, e é
        ele que o teste de ausência de campo privado cobre.

        Nenhum dado de conta existe aqui: e-mail de login, hash de senha, token e identificador
        de conta ficam fora do schema (RNF013). `afiliacaoDeclarada` é DECLARAÇÃO do próprio
        autor, nunca vínculo verificado pela plataforma (RN011, §13.1).
      required: [slug, nomePublico, areasInteresse, linksExternos]
      properties:
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: Slug público e único do perfil; base da URL canônica `/u/{slug}` (RNF025).
          example: maria-silva
        nomePublico:
          type: string
          description: Nome público do autor (RF006).
          example: Maria Silva
        biografia:
          type: string
          description: Biografia do autor. Opcional; ausente quando não informada (RN004).
          example: Professora de programação; escreve material introdutório de algoritmos.
        afiliacaoDeclarada:
          type: string
          description: |
            Afiliação DECLARADA pelo autor — nunca vínculo verificado pela plataforma
            (RN011, §13.1). Ausente quando não informada.
          example: Declaro vínculo com a Universidade de Exemplo — autodeclaração, sem verificação da plataforma.
        areasInteresse:
          type: array
          description: Áreas de interesse declaradas. Lista vazia quando o autor não informou.
          items:
            type: string
          example: [algoritmos, estruturas de dados]
        linksExternos:
          type: array
          description: |
            Links externos declarados pelo autor (texto livre, sem verificação no MVP).
            Lista vazia quando o autor não informou.
          items:
            type: string
          example: ["https://github.com/maria-silva"]

    AutorPublico:
      description: |
        Identidade pública do autor (RF006, §11.1.2) e a página dos materiais publicados
        dele. A parte de identidade é composta de `PerfilPublico` — o mesmo schema do perfil
        próprio —, de forma que os campos públicos estão descritos em um só lugar e o pedido
        público e o privado não divergem.

        Nenhum dado de conta — e-mail de login, hash de senha, token e id de conta ficam fora do
        schema (RNF013). `afiliacaoDeclarada` é declaração do próprio autor, nunca vínculo
        verificado (RN011, §13.1).
      allOf:
        - $ref: '#/components/schemas/PerfilPublico'
        - type: object
          required: [materiais]
          properties:
            materiais:
              description: |
                Página dos materiais publicados do autor, no envelope padrão. `page` e `size` da
                requisição paginam esta lista; autor sem material publicado responde 200 com
                `items: []` (E2.5).
              $ref: '#/components/schemas/PaginaMateriais'

    CadastroConta:
      type: object
      description: |
        Dados mínimos do cadastro (RF008, §7.2). O `slug` inicial do perfil é derivado do nome
        público pelo servidor, não recebido do cliente; o e-mail é normalizado (minúsculas, sem
        espaços) antes de virar chave única (RN009).
      required: [email, senha, nomePublico]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: E-mail de login, validado e normalizado; é o identificador único de identidade (RN009).
          example: maria.silva@exemplo.invalid
        senha:
          type: string
          minLength: 8
          maxLength: 72
          description: |
            Senha em texto puro, existente só nesta requisição: o servidor guarda apenas o hash
            bcrypt 12 (ADR-0003 (a)). O teto de 72 caracteres acompanha o limite de 72 bytes do
            bcrypt — aceitar mais seria descartar o excedente em silêncio. Nunca é registrada em
            log nem devolvida em resposta (RNF009).
          example: nota-de-aula-2026
        nomePublico:
          type: string
          minLength: 1
          maxLength: 120
          description: Nome público exibido como autor (RF006); base do `slug` inicial do perfil.
          example: Maria Silva

    Credenciais:
      type: object
      description: |
        Credenciais de login (RF009). A senha entra em texto puro só nesta requisição — o servidor
        a compara com o hash bcrypt 12 da conta. Rejeição devolve 401 com o mesmo corpo para
        e-mail inexistente e senha errada (RNF013).
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: E-mail de login (normalizado pelo servidor).
          example: maria.silva@exemplo.invalid
        senha:
          type: string
          description: Senha em texto puro. Nunca registrada em log nem devolvida (RNF009).
          example: nota-de-aula-2026

    EdicaoPerfil:
      type: object
      description: |
        Campos públicos do próprio perfil (RF011). Não existe campo de identificador de conta ou
        de perfil: a propriedade vem da sessão (ADR-0003 (j), CA007). Campos opcionais podem ser
        enviados vazios ou ausentes — os dois valem como "não informado".
      required: [nomePublico, slug]
      properties:
        nomePublico:
          type: string
          minLength: 1
          maxLength: 120
          description: Nome público exibido como autor (RF006).
          example: Maria Silva
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          minLength: 3
          maxLength: 120
          description: |
            Identificador público único do perfil (RN009). É a chave da URL `/u/{slug}` e o valor
            aceito em `/autores/{slug}`. Fora do padrão → 422; já em uso por outra conta → 409.
          example: maria-silva
        biografia:
          type: string
          maxLength: 600
          description: Biografia curta. Opcional; vazia vale como não informada.
          example: Professora de programação; escreve material introdutório de algoritmos.
        afiliacaoDeclarada:
          type: string
          maxLength: 300
          description: |
            Afiliação DECLARADA pelo autor — nunca vínculo verificado pela plataforma (RN011,
            §13.1). Opcional; vazia vale como não informada.
          example: Declaro vínculo com a Universidade de Exemplo — autodeclaração, sem verificação da plataforma.
        areasInteresse:
          type: array
          maxItems: 20
          description: Áreas de interesse declaradas. Opcional; lista vazia vale como não informada.
          items:
            type: string
            maxLength: 60
          example: [algoritmos, estruturas de dados]
        linksExternos:
          type: array
          maxItems: 20
          description: |
            Links externos declarados — site pessoal ou perfil acadêmico (RF011). Opcional; lista
            vazia vale como não informada. Texto livre, sem verificação no MVP.
          items:
            type: string
            maxLength: 300
          example: ["https://github.com/maria-silva"]

    EdicaoDeMaterial:
      type: object
      description: |-
        Conjunto editável dos metadados de um material próprio (RF016, ADR-0011 §4). Substitui o
        conjunto: os cinco campos são **obrigatórios**, como na publicação, porque a tela os
        apresenta todos preenchidos — campo obrigatório ausente devolve **400** (o servidor não
        conseguiu ler o pedido como veio) e campo presente com valor inválido devolve **422**
        `validacao_campo`, apontado em `errors[]`.

        `categoriaSlug`, `tipoSlug` e `licencaSlug` são os `slug` estáveis da taxonomia (ADR-0006,
        RF018) — os mesmos valores que a leitura devolve e que os filtros de descoberta aceitam.
        `slug` bem formado mas inexistente (ou inativo) devolve **422** no campo correspondente, e
        nenhuma licença é atribuída automaticamente: o dono escolhe.

        **Fora deste schema, e por isso imutável por esta rota:** `slug` (a URL canônica pública,
        RNF025 — trocá-lo quebraria link e indexação), autoria e propriedade (vêm da sessão, RN001:
        `autorSlug`, `contaId` ou `perfilId` no corpo são **ignorados**, não há campo para tentar),
        `estado` (é o `PATCH`, ato distinto), o arquivo (trocar o binário mexe em validação,
        armazenamento, órfãos e retenção — é outra operação, sem requisito no MVP) e
        `declaracaoDireito` (pertence ao ato de publicar, RF012, e não é re-perguntada: a autoria do
        registro não muda).
      required: [titulo, descricao, categoriaSlug, tipoSlug, licencaSlug]
      properties:
        titulo:
          type: string
          minLength: 1
          maxLength: 200
          description: Título do material (RN004); é o `title` de SEO da página pública.
          example: Introdução a algoritmos de ordenação (revisada)
        descricao:
          type: string
          minLength: 1
          maxLength: 2000
          description: Descrição do material (RN004); é a base do `description` de SEO.
          example: Nota de aula sobre ordenação por comparação, com análise de complexidade, exemplos em pseudocódigo e exercícios resolvidos.
        categoriaSlug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: |-
            `slug` da categoria (RF018). Precisa existir e estar ativa; inexistente ou inativa → 422
            no campo.
          example: computacao-e-tecnologia
        tipoSlug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: |-
            `slug` do tipo de material (RF018). Precisa existir e estar ativo; inexistente ou inativo
            → 422 no campo.
          example: nota-de-aula
        licencaSlug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9.]+)*$'
          description: |-
            `slug` da licença de reutilização (RF018, RN006). Precisa existir e estar ativa;
            inexistente ou inativa → 422 no campo.
          example: cc-by-4.0

    TransicaoDeMaterial:
      type: object
      description: |-
        Ato de retirar o material do público ou repô-lo nele (RF017, RF019). Um campo, um ato: o
        estado é a única dimensão que muda aqui, e a transição é a que a máquina de estados do
        domínio já declara — o contrato não inventa uma segunda regra (ADR-0011 §5).

        Os valores aceitos são `RETIRADO` e `PUBLICADO`. **Repor no público é publicar**
        (ADR-0003 (b)): `RETIRADO → PUBLICADO` com conta `PENDENTE_VERIFICACAO` devolve **403** com
        mensagem que diz o que falta ("confirme seu e-mail para republicar o material"). Retirar
        **não** exige verificação — tirar do público não coloca nada novo nele.

        `EXCLUIDO` **não** é valor aceito: a exclusão é o `DELETE`, ato próprio e terminal no MVP, e
        tentar excluir por aqui devolve **422** no campo com mensagem que aponta a operação certa
        (RF019). Pedir o estado em que o material já está responde **200 sem escrita** — idempotente.
      required: [estado]
      properties:
        estado:
          type: string
          enum: [PUBLICADO, RETIRADO]
          description: |-
            Estado de destino do material. `RETIRADO` tira da descoberta, da busca e do download;
            `PUBLICADO` o devolve ao público (exige conta `ATIVO`). Qualquer outro valor — inclusive
            `EXCLUIDO` — → 422 no campo.
          example: RETIRADO

    SessaoAtual:
      type: object
      description: |
        Estado da sessão corrente (RF009): se há sessão e, havendo, quem é. Devolve o perfil
        público e o estado da conta — nunca e-mail de login, hash, token ou identificador de
        conta, nem para o dono (RNF013).

        Publicar exige `estadoConta: ATIVO` (verificação de e-mail concluída); navegar, pesquisar
        e editar o próprio perfil não exigem (ADR-0003 (b)).
      required: [autenticado]
      properties:
        autenticado:
          type: boolean
          description: |
            `true` quando a requisição trouxe sessão válida. `false` é o estado normal do
            visitante — a resposta de `GET /sessoes/atual` é 200 nos dois casos, nunca 401.
          example: true
        estadoConta:
          type: string
          enum: [PENDENTE_VERIFICACAO, ATIVO]
          description: |
            Estado da conta autenticada. Presente apenas com `autenticado: true`. `SUSPENSO` não
            aparece aqui: conta suspensa não mantém sessão (o login a recusa com 403), e publicar
            só é possível em `ATIVO` (ADR-0003 (b)).
          example: PENDENTE_VERIFICACAO
        perfil:
          description: Presente apenas quando `autenticado` é verdadeiro.
          $ref: '#/components/schemas/PerfilPublico'

    ReenvioVerificacao:
      type: object
      description: |
        Aceite do reenvio de verificação de e-mail (ADR-0003 (c)). Traz os dois instantes para o
        frontend mostrar a contagem até o próximo reenvio, em vez de o usuário descobrir o
        cooldown por tentativa e erro.
      required: [reenviadoEm, podeReenviarEm]
      properties:
        reenviadoEm:
          type: string
          format: date-time
          description: Instante em que o reenvio foi aceito.
          example: '2026-10-17T12:00:00Z'
        podeReenviarEm:
          type: string
          format: date-time
          description: Instante a partir do qual um novo reenvio é aceito (cooldown de 60 s).
          example: '2026-10-17T12:01:00Z'

    ConfirmacaoToken:
      type: object
      description: |
        Token de uso único recebido por e-mail (ADR-0003 (c)). Vai no corpo, nunca no caminho da
        URL: token em URL entra no log de acesso, e RNF009 proíbe registrar token.
      required: [token]
      properties:
        token:
          type: string
          description: |
            Token opaco de 32 bytes URL-safe. O servidor guarda apenas o hash (SHA-256) — o valor
            em claro existe só no link enviado. Inválido, expirado ou já consumido recebem a mesma
            resposta (422).
          example: 3vJ8kQ2mR7sT1wX5yZ9aB4cD6eF0gH2i

    RecuperacaoSolicitacao:
      type: object
      description: |
        Pedido de recuperação de acesso (RF010). A resposta é a mesma exista ou não a conta
        (RNF013), então o corpo não carrega nada que as distinga.
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: E-mail da conta a recuperar.
          example: maria.silva@exemplo.invalid

    RecuperacaoConfirmacao:
      type: object
      description: |
        Conclusão da recuperação (RF010, ADR-0003 (d)): token de uso único (validade de 30 min) e
        a senha nova. Token inválido, expirado ou já consumido e senha fora do intervalo devolvem
        422, sem distinguir os casos.
      required: [token, novaSenha]
      properties:
        token:
          type: string
          description: Token de recuperação recebido por e-mail; vai no corpo, nunca no caminho (RNF009).
          example: 9dC1eB5aF3gH7iJ0kL2mN4oP6qR8sT1u
        novaSenha:
          type: string
          minLength: 8
          maxLength: 72
          description: |
            Nova senha em texto puro; o servidor guarda só o hash bcrypt 12. Mesmo intervalo do
            cadastro (8 a 72 caracteres — o teto vem do bcrypt). Trocar a senha invalida todas as
            sessões abertas da conta.
          example: nova-senha-2026

    PaginaMateriais:
      description: Envelope de paginação (ver `Pagina`) com materiais públicos em `items`.
      allOf:
        - $ref: '#/components/schemas/Pagina'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MaterialResumo'

    ProblemDetail:
      type: object
      description: |
        Formato único de erro do contrato (RFC 7807, `application/problem+json`),
        usado em toda resposta 4xx/5xx. `type` é um URN estável que identifica a classe
        do erro (`urn:scipath:erro:<slug>`), o cliente decide pelo `type`, nunca pelo
        texto; `title` é o rótulo curto e estável; `detail` explica o caso concreto e é
        seguro para exibir (RNF012 — sem stack trace, SQL ou caminho de arquivo);
        `errors[]` só aparece em erro de campo, nunca em erro sistêmico.

        Vocabulário fechado: a API emite exatamente estas onze classes, cada uma com o
        status HTTP correspondente. O `status` no corpo repete o status da resposta; o
        cliente decide por `type`.

        | `type` | status | situação | `errors[]` |
        |---|---|---|---|
        | `urn:scipath:erro:validacao` | 400 | o pedido não pôde ser processado como veio: valor recusado em consulta/caminho, ou corpo ilegível | sim, quando aponta o parâmetro |
        | `urn:scipath:erro:nao_autenticado` | 401 | a operação exige identidade e não há sessão válida (ausente, expirada ou revogada) | não |
        | `urn:scipath:erro:acesso_negado` | 403 | há identidade e ela não tem permissão; inclui escrita sem `X-CSRF-Token`, login em conta suspensa, publicação com e-mail não verificado e republicação de material próprio por conta não verificada | não |
        | `urn:scipath:erro:nao_encontrado` | 404 | o recurso pedido não existe, ou o endereço não corresponde a nenhum recurso ou endpoint | não |
        | `urn:scipath:erro:metodo_nao_permitido` | 405 | o endereço existe, mas não responde a este método | não |
        | `urn:scipath:erro:conflito_de_unicidade` | 409 | o valor já pertence a outro registro: e-mail já cadastrado ou `slug` já em uso | sim, o campo em conflito |
        | `urn:scipath:erro:arquivo_muito_grande` | 413 | o arquivo enviado excede o limite de upload configurado | não |
        | `urn:scipath:erro:tipo_nao_suportado` | 415 | o `Content-Type` enviado não é aceito, ou o arquivo publicado não é PDF válido | não |
        | `urn:scipath:erro:validacao_campo` | 422 | o corpo foi lido e um campo tem valor inválido (formato, intervalo, token inválido/expirado, taxonomia inexistente) | sim, um item por campo culpado |
        | `urn:scipath:erro:reenvio_em_cooldown` | 429 | reenvio de verificação pedido antes do fim do cooldown de 60 s | não |
        | `urn:scipath:erro:interno` | 500 | falha inesperada; detalhe técnico fica só no log do servidor | não |

        `errors[]` acompanha o erro que aponta um campo: `validacao` (400), quando o valor
        recusado é um parâmetro de consulta ou de caminho; `conflito_de_unicidade` (409), com o
        campo que colidiu; e `validacao_campo` (422), com um item por campo do corpo culpado. Erro
        que não é de campo não carrega a lista — 401, 403, 404, 405, 413, 415, 429 e 500 explicam a
        situação no `detail`.

        Um endpoint só documenta os status que o seu caminho pode produzir: 405 aparece em todo
        endpoint publicado (o caminho existe, o método errado é recusado); 404 aparece nos
        endpoints com recurso no caminho (`/materiais/{slug}`, `/autores/{slug}`,
        `/materiais/{slug}/arquivo` e, a partir da v0.6.0, `/perfil/atual/materiais/{slug}`, onde
        ele é o mesmo corpo do 404 público); 413 aparece na publicação quando o arquivo excede o limite;
        415 nas escritas que recebem corpo (`application/json` ou o `multipart/form-data` da
        publicação); 401 nas operações que exigem identidade; 403 nas escritas que exigem
        `X-CSRF-Token`, no login de conta suspensa, na publicação com e-mail não verificado e na
        republicação de material próprio por conta não verificada (v0.6.0); 409
        nos dois pontos de unicidade (cadastro e `slug` de perfil); 422 nos endpoints que leem
        corpo; 429 só no reenvio de verificação. A classe existe neste schema mesmo antes de o
        endpoint existir porque o formato foi implementado de uma vez (card E1.4) — o que muda
        depois é qual endpoint pode devolvê-la, não o formato.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          enum:
            - urn:scipath:erro:validacao
            - urn:scipath:erro:nao_autenticado
            - urn:scipath:erro:acesso_negado
            - urn:scipath:erro:nao_encontrado
            - urn:scipath:erro:metodo_nao_permitido
            - urn:scipath:erro:conflito_de_unicidade
            - urn:scipath:erro:arquivo_muito_grande
            - urn:scipath:erro:tipo_nao_suportado
            - urn:scipath:erro:validacao_campo
            - urn:scipath:erro:reenvio_em_cooldown
            - urn:scipath:erro:interno
          description: |
            Classe do erro, uma das dez do vocabulário. `type` novo é mudança de
            contrato antes de ser mudança de código (AGENTS.md regra 1).
          example: urn:scipath:erro:validacao
        title:
          type: string
          description: Rótulo curto e estável da classe do erro.
          example: Requisição inválida
        status:
          type: integer
          minimum: 400
          maximum: 599
          description: Código HTTP, repetido no corpo.
          example: 400
        detail:
          type: string
          description: Explicação do caso concreto, segura para exibir ao usuário.
          example: O parâmetro 'ativo' deve ser true ou false.
        instance:
          type: string
          description: Caminho da requisição que originou o erro.
          example: /api/categorias
        errors:
          type: array
          description: Erros de campo; ausente quando o erro não é de validação.
          items:
            $ref: '#/components/schemas/ErroDeCampo'
      example:
        type: urn:scipath:erro:validacao
        title: Requisição inválida
        status: 400
        detail: O parâmetro 'ativo' deve ser true ou false.
        instance: /api/categorias
        errors:
          - campo: ativo
            mensagem: deve ser true ou false

    ErroDeCampo:
      type: object
      description: Um campo recusado pela validação, identificado pelo caminho no payload.
      required: [campo, mensagem]
      properties:
        campo:
          type: string
          description: Caminho do campo no payload ou nome do parâmetro de consulta.
          example: ativo
        mensagem:
          type: string
          description: Motivo da recusa, acionável e sem detalhe interno.
          example: deve ser true ou false
