  /contas:
    post:
      tags: [identidade]
      summary: Cria a conta e abre a sessão
      description: |
        Cadastro (RF008, RN009, CA004). O e-mail é validado e normalizado (minúsculas, sem
        espaços) antes de virar chave única; a senha vira hash bcrypt custo 12 e nunca é
        persistida em texto puro nem registrada em log (RNF009). A conta nasce
        `PENDENTE_VERIFICACAO` e o perfil inicial recebe um `slug` derivado do nome, garantido
        único (RN009).

        Sucesso devolve **201** e **já abre a sessão**: o usuário sai autenticado, sem precisar
        entrar logo em seguida (DRS §7.2). O corpo é o mesmo estado de sessão de
        `GET /sessoes/atual`, e a resposta traz o `Set-Cookie` da sessão.

        Este é o **único** ponto do contrato em que a resposta revela que existe conta com
        determinado e-mail: cadastrar com e-mail já usado responde **409**, porque o formulário
        precisa dizer isso para ser útil. Login e recuperação nunca fazem essa distinção (RNF013).

        Sem o `X-CSRF-Token` a requisição é recusada com **403** — a escrita é protegida mesmo
        antes de existir sessão.

        A senha aceita de 8 a 72 caracteres: o teto existe porque o bcrypt considera no máximo 72
        bytes do segredo, e aceitar mais seria descartar o excedente em silêncio (ADR-0003 (a)).
      operationId: criarConta
      parameters:
        - $ref: '#/components/parameters/TokenCsrf'
      requestBody:
        required: true
        description: Dados mínimos do cadastro. O `slug` inicial é derivado do nome público, não enviado pelo cliente.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CadastroConta'
            examples:
              cadastro:
                summary: Cadastro válido
                value:
                  email: maria.silva@exemplo.invalid
                  senha: nota-de-aula-2026
                  nomePublico: Maria Silva
      responses:
        '201':
          description: Conta criada em `PENDENTE_VERIFICACAO`, com a sessão já aberta.
          headers:
            Set-Cookie:
              description: |
                Cookie de sessão do ADR-0003 (e), com os atributos declarados no topo deste
                documento. O valor é opaco e não é documentado aqui.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessaoAtual'
              examples:
                contaCriada:
                  summary: Conta recém-criada e autenticada, com verificação pendente
                  value:
                    autenticado: true
                    estadoConta: PENDENTE_VERIFICACAO
                    perfil:
                      slug: maria-silva
                      nomePublico: Maria Silva
                      areasInteresse: []
                      linksExternos: []
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '403':
          $ref: '#/components/responses/ErroAcessoNegado'
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'
        '409':
          $ref: '#/components/responses/ErroConflitoUnicidade'
        '415':
          $ref: '#/components/responses/ErroTipoNaoSuportado'
        '422':
          $ref: '#/components/responses/ErroValidacaoCampo'
        '500':
          $ref: '#/components/responses/ErroInesperado'

  /sessoes:
