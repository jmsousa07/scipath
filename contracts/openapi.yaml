  /perfil/atual/materiais/{slug}:
    get:
      tags: [gerenciamento]
      summary: Lê um material próprio, em qualquer estado
      description: |-
        Detalhe de um material da conta autenticada (RF015) — é a leitura que **pré-preenche a
        edição** e que enxerga o material `RETIRADO`, para o qual o detalhe público responde 404
        (RN002).

        **A leitura vale nos três estados**, inclusive `EXCLUIDO`: o dono não perde o registro do que
        excluiu, e a lista dele mostra o mesmo (ADR-0011 §2). Quem exige material vivo são as rotas
        de **ação** — `PUT`, `PATCH` e `DELETE`.

        **Material de outra conta ou inexistente responde o mesmo 404**, indistinguível do 404
        público — mesmo status e mesmo corpo (RN002, CA007): a leitura do dono não vira oráculo de
        existência de material alheio. `slug` fora do formato de slug é **400** (o endereço está
        malformado; não é o recurso que falta).

        Nenhum dado privado (RNF013): é o mesmo `MaterialProprio` da lista, e ele não carrega e-mail,
        hash, token, identificador de conta, vínculo de perfil nem chave de armazenamento ou caminho
        interno (RNF014).

        Este é o estado do **dono**, não o público: material `RETIRADO` e `EXCLUIDO` aparecem aqui e
        não aparecem em `/materiais/{slug}`.
      operationId: getMaterialProprio
      security:
        - SessaoCookie: []
      parameters:
        - $ref: '#/components/parameters/SlugRecurso'
      responses:
        '200':
          description: Material do dono, em qualquer dos três estados.
          content:
            application/json:
              schema:
