                      descricaoCurta: O material continua protegido. Ler e baixar é permitido; reutilizar não é.
                    arquivo:
                      nomeOriginal: resumo-de-grafos.pdf
                      tamanhoBytes: 204800
                      disponivel: true
                    publicadoEm: '2026-09-02T12:00:00Z'
                    atualizadoEm: '2026-10-10T18:20:00Z'
        '400':
