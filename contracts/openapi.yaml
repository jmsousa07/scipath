openapi: 3.1.0

info:
  title: SciPath API
  version: 0.6.0
  description: |
    Fronteira entre backend e frontend do SciPath. Este arquivo é a fonte de verdade:
    mudança de API começa aqui, no mesmo card da implementação (AGENTS.md, DRS §14.3).

    v0.6.0 — gerenciamento do material próprio (card E5.1). Abre a Etapa 5 do DRS (§18): listar e
    ler os próprios (`GET /perfil/atual/materiais`, `GET /perfil/atual/materiais/{slug}`), editar
    metadados (`PUT`), retirar ou repor no público (`PATCH`) e excluir (`DELETE`), tudo sob a tag
    `gerenciamento`. Até a v0.5 existia o **efeito** da retirada — material `RETIRADO` fora da
    descoberta — e não o **ato**: `PUT`/`PATCH`/`DELETE /materiais/{slug}` respondiam 405, e era o
    que deixava CA007 e CA008 parcialmente NÃO VERIFICADOS no aceite do MVP. As decisões de
    fronteira, com o porquê, estão em `docs/adr/ADR-0011-gerenciamento-material-proprio.md`:

    - **A superfície é `/perfil/atual/materiais`, não `/materiais/proprios`.** O material é do perfil
      da sessão (RN001) e `/perfil/atual` já existe desde a v0.4. O literal `proprios` colidiria com
      `GET /materiais/{slug}`: um material cujo slug fosse `proprios` ficaria inalcançável
      publicamente, porque a rota privada capturaria o endereço dele (RNF025).
    - **A visão do dono mostra os três estados** — `PUBLICADO`, `RETIRADO` e `EXCLUIDO` (RF015,
      PAGE_BLUEPRINTS §12). O RF017 tira o material das listagens **públicas**; esconder do dono o
      que ele acabou de excluir é que seria desonesto. As **ações**, porém, valem em `PUBLICADO` e
      `RETIRADO`: `EXCLUIDO` é terminal no MVP, e a leitura o mostra sem oferecer ato nenhum.
    - **Uma regra só de recusa nas rotas de ação**: material inexistente, **de outra conta** ou já
      `EXCLUIDO` responde **404 com o mesmo corpo do 404 público** — é literalmente o mesmo
      componente de resposta, não uma cópia que pode divergir. Um 403 confirmaria a existência de
      material alheio retirado ou excluído e faria do código de status um oráculo de enumeração,
      exatamente o que o CA008 evita no caminho público (RN002). A assimetria é deliberada: a
      **leitura** mostra o histórico do dono; a **ação** exige material vivo.
    - **Editar é metadado, e o que fica de fora é decisão.** `EdicaoDeMaterial` tem cinco campos —
      título, descrição, categoria, tipo de material e licença, com os mesmos limites de
      `PublicacaoMaterial`. Fora do schema: `slug` (é a URL canônica, RNF025), autoria/propriedade
      (vem da sessão, RN001), `estado` (é o `PATCH`), o arquivo (trocá-lo é outra operação, sem
      requisito no MVP) e `declaracaoDireito` (pertence ao ato de publicar, RF012). `publicadoEm`
      **nunca** muda, inclusive na republicação: se republicar reescrevesse a data, retirar e
      publicar de novo viraria manobra para subir ao topo da listagem pública, que ordena por
      `publicado_em`.
    - **O estado muda por `PATCH` de um campo**, validado pela mesma máquina de estados que o
      domínio já usa (fonte única — o contrato não inventa uma segunda regra). Pedir o estado em que
      o material já está responde **200 sem escrita** (idempotente, para repetir o ato não virar
      erro de tela); `EXCLUIDO` no corpo responde **422** com mensagem que aponta o `DELETE`
      (exclusão não entra por valor de estado — RF019); e repor no público com conta
      `PENDENTE_VERIFICACAO` responde **403** com mensagem acionável, porque repor é publicar
      (ADR-0003 (b)) — editar, retirar e excluir **não** exigem verificação. Excluir (`DELETE`,
      **204** sem corpo) é exclusão **lógica**: metadados retidos e binário purgado 7 dias depois
      pela rotina de retenção (ADR-0005 §3). A confirmação que o RF017 pede é ato da interface, não
      parâmetro deste contrato: um campo `confirmacao` no corpo não confirmaria nada, já que o
      cliente sempre pode enviá-lo.

    **A v0.5.0 permanece íntegra**: nenhuma rota, campo ou resposta que as Etapas 2–4 usam mudou de
    forma ou de significado. O que esta versão acrescenta é superfície — cinco rotas, quatro schemas,
    uma tag, uma resposta de erro nova e um exemplo novo numa resposta de erro que já existia (a
    transição de estado recusada e a republicação por conta não verificada, as duas situações que só
    acontecem aqui). **Nenhuma classe de erro nova**: as duas situações são a mesma
    `urn:scipath:erro:validacao_campo` (422) e a mesma `urn:scipath:erro:acesso_negado` (403) que já
    estavam no vocabulário e já eram emitidas pelo backend. A única redação da v0.5 que muda é a
    lista de onde o 403 pode aparecer, no schema `ProblemDetail` — muda por acréscimo, e o formato
    do erro não muda.

    A rota do logout **permanece `DELETE /sessoes/atual`**, como publicada na v0.4.0: esta versão não
    a altera, e a divergência entre o que o frontend chamava e o que o contrato publica é defeito de
    **código**, não decisão nova de fronteira (a correção é de código, card F1). Se a correção pedir
    contrato diferente, ela volta aqui primeiro (AGENTS.md regra 1).

    v0.5.0 — publicação de material e acesso ao arquivo (card E4.1). Abre a Etapa 4 do DRS (§8.3):
    publicar material próprio (`POST /materiais`, `multipart/form-data` com os metadados e o arquivo
    na MESMA requisição) e baixar o arquivo de material público (`GET /materiais/{slug}/arquivo`).
    Duas decisões de fronteira valem para todo o contrato:

    - **Publicar é uma transação.** Metadados e arquivo chegam juntos porque é o que torna a ordem
      do RN008 implementável: o servidor recebe, valida o arquivo, move para o storage definitivo e
      só então grava material e arquivo **na mesma transação** (ADR-0005 §2). Nunca existe material
      publicado apontando para arquivo não validado.
    - **O arquivo é servido pelo servidor, nunca por caminho direto.** `GET /materiais/{slug}/arquivo`
      decide visibilidade e autorização no servidor (RN002, RN003) e responde o mesmo 404 para
      material inexistente, RETIRADO ou EXCLUIDO; o corpo nunca traz caminho, chave de storage nem
      credencial (RF014, RNF014). O `MaterialDetalhe` ganha apenas o metadado que a tela precisa para
      oferecer o download (`arquivo`), nunca o endereço interno.

    A **v0.4.0 permanece íntegra**: nenhuma rota, campo ou resposta que a Etapa 3 usa mudou de forma
    ou de significado. O que esta versão acrescenta são rotas, schemas e uma classe de erro nova
    (`arquivo_muito_grande`, 413) ao vocabulário fechado; o único campo acrescentado a um schema
    existente é `arquivo`, em `MaterialDetalhe` — a Etapa 2 lê o mesmo corpo de antes e continua
    lendo o mesmo (o campo novo é aditivo).

    v0.4.0 — identidade, sessão e perfil (card E3.1). Abre a Etapa 3 do DRS (§18): criar conta,
    autenticar, encerrar sessão, editar o próprio perfil e confirmar o e-mail. A maior parte da
    superfície nova exige sessão; apenas o cadastro (`POST /contas`) e o pedido de recuperação
    (`POST /recuperacao-senha/solicitacoes`) respondem sem sessão, e o pedido de recuperação
    responde **igual** exista ou não a conta (RNF013 — nada de enumeração de contas). O
    vocabulário de erro ganha três classes — `conflito_de_unicidade` (409), `validacao_campo`
    (422) e `reenvio_em_cooldown` (429) — e a validação passa a distinguir o pedido que o
    servidor não conseguiu processar (`validacao`, 400) do corpo lido com campo de valor
    inválido (`validacao_campo`, 422).

    **v0.3.0 permanece íntegra.** Nenhuma rota, campo ou resposta que os consumidores da Etapa 2
    usam mudou de forma ou de significado: as três superfícies de descoberta respondem o mesmo
    payload de antes. O que esta versão faz com a v0.3 é acrescentar — rotas, classes de erro,
    schemas — e reorganizar por dentro um schema que já existia (`AutorPublico` passa a compor
    `PerfilPublico`), sem alterar a instância JSON que o cliente recebe.

    Decisões de identidade que valem para todo o contrato (ADR-0003, DRS §20.3 itens 2 e 3):

    - **Onde a sessão vive.** A sessão é persistida **em tabela no PostgreSQL**, não na memória do
      servidor. É o que torna a revogação real e sobrevivente ao reinício do processo (ADR-0003
      (e) pede sessão revogável), o que permite à recuperação de acesso invalidar todas as
      sessões de uma conta de uma vez, e o que dispensa sessão presa a uma instância. O custo
      aceito é uma consulta por requisição autenticada. A tabela nasce de migração aditiva da
      Etapa 3 — migração nova, nunca edição do modelo já aplicado (AGENTS.md regra 1).
    - **Cookie de sessão.** `SCIPATH_SESSAO`, opaca, `HttpOnly`, `Secure`, `SameSite=Lax`,
      `Path=/`. O frontend chama a API pela **mesma origem** (proxy `/api` do Next em
      desenvolvimento), então o cookie viaja sozinho e nunca depende de JavaScript — nada de
      segredo de sessão acessível ao JavaScript, nada de sessão em `localStorage` (ADR-0003 (e)).
    - **Expiração.** Inatividade de **12 h** e limite absoluto de **7 dias**, os dois declarados
      aqui e aplicados no servidor: passado qualquer um dos prazos, a requisição seguinte com
      aquele cookie responde **401** (ADR-0003 (e)).
    - **CSRF.** Toda escrita (POST, PUT, DELETE) exige o cabeçalho `X-CSRF-Token`; ausente ou
      sem correspondência com a sessão, a resposta é **403** `acesso_negado`. O token é emitido
      pelo servidor na cookie `XSRF-TOKEN`, legível pelo frontend da mesma origem — ao contrário
      da cookie de sessão, porque é o frontend que devolve o valor no cabeçalho — e a primeira
      leitura do app (`GET /sessoes/atual`) já a traz. Numa escrita que exige identidade e chega
      **sem sessão**, a resposta é **401**: a autenticação precede a checagem de CSRF, então o 403
      de CSRF aparece quando há sessão. As duas confirmações por token (verificação de e-mail e
      recuperação de senha) não exigem o cabeçalho em nenhum caso: o segredo vai no corpo e não há
      cookie de sessão em jogo.
    - **Token de verificação e de recuperação vai no corpo, nunca no caminho da URL.** Caminho e
      consulta entram no log de acesso do servidor, e token em log é exatamente o que RNF009
      proíbe. O link do e-mail aponta para uma página do frontend, que envia o token no corpo da
      confirmação.
    - **Publicar exige conta `ATIVO`** (verificação de e-mail concluída — ADR-0003 (b)). Navegar,
      pesquisar e **editar o próprio perfil não exigem**: quem está em `PENDENTE_VERIFICACAO`
      entra, navega e edita o perfil. O endpoint de publicação existe a partir da v0.5
      (`POST /materiais`); a regra entra aqui porque é o estado da conta que a define.
    - **Nada privado na resposta.** E-mail de login, hash de senha, token e identificador interno
      de conta não existem em nenhum schema deste contrato — nem no perfil público, nem no perfil
      próprio, nem no estado da sessão (RNF013). O estado da sessão devolve o perfil público e o
      estado da conta, e mais nada.

    v0.3.0 — descoberta pública (card E2.1). Publica a fronteira do visitante sem conta:
    listar materiais públicos (`GET /api/materiais`), ver o detalhe de um material
    (`GET /api/materiais/{slug}`) e ver o perfil público de um autor com os materiais dele
    (`GET /api/autores/{slug}`). Três superfícies, todas somente-leitura, todas regidas
    pelas mesmas regras: só material PUBLICADO de conta ATIVA aparece (RN002), a licença
    vem sempre explícita com o que permite (RN006) e nenhum campo privado existe no schema
    (RNF013). Sobe a versão menor porque é a primeira vez que a busca e a leitura de
    material entram no contrato — mudança de fronteira real, não de redação.

    v0.2.1 — vocabulário de erro publicado por inteiro (card E1.1a). O backend já emitia
    sete classes `urn:scipath:erro:<slug>` desde o E1.4, mas o v0.2.0 só publicava duas
    (`validacao` e `interno`); as outras cinco ficavam fora da fronteira e o frontend
    teria de decidir sobre códigos que o contrato não conhecia (DRS §21.1). Nada no
    payload mudou — o backend não foi tocado e as mesmas respostas continuam valendo —,
    então a versão sobe em patch. O `type` agora é enumeração fechada no schema
    `ProblemDetail`, com a situação e o `errors[]` de cada classe.

    v0.2.0 — base do produto: estado operacional (RF022) e leitura da taxonomia de
    referência (RF018). Os endpoints de material herdados do esqueleto F0.1 foram
    removidos: não tinham requisito implementado, e uma fronteira publicada sem
    implementação faz o frontend codificar contra ficção (DRS §21.1). Serão reescritos
    na Etapa 2, quando tiverem requisito e modelo de dados no card que os especifica.

    Convenções vinculantes para todo endpoint:
    - **Erro único.** Toda resposta 4xx/5xx usa `application/problem+json` com o schema
      `ProblemDetail` (RFC 7807). `errors[]` só aparece em erro de campo. Não existe
      segundo formato de erro no contrato. O `type` é um vocabulário **fechado** de onze
      classes — `validacao` (400), `nao_autenticado` (401), `acesso_negado` (403),
      `nao_encontrado` (404), `metodo_nao_permitido` (405), `conflito_de_unicidade` (409),
      `arquivo_muito_grande` (413), `tipo_nao_suportado` (415), `validacao_campo` (422),
      `reenvio_em_cooldown` (429) e `interno` (500) — enumerado no schema `ProblemDetail`, que
      também diz em que situação cada uma aparece e se ela carrega `errors[]`. Cliente que
      precisa de um `type` novo muda o contrato primeiro, nunca o código sozinho.
    - **Onde o valor errado está decide o código.** Valor recusado em **consulta ou caminho**
      (parâmetro de URL), ou pedido que o servidor não conseguiu ler, é **400**
      `urn:scipath:erro:validacao`; corpo lido com **campo** de valor inválido é **422**
      `urn:scipath:erro:validacao_campo`. Quem trata formulário decide pelo 422; quem monta
      consulta decide pelo 400.
    - **Identidade é sessão, não token no cliente.** Operação que exige identidade usa a cookie
      de sessão (`SessaoCookie`) e a declara com `security`; escrita exige também o cabeçalho
      `X-CSRF-Token`. Não existe `Authorization` nem JWT neste contrato (ADR-0003 (e)).
    - **Lista paginada única.** Toda listagem usa o envelope `Pagina` — `items`, `page`,
      `size`, `total` (RF002, RNF021) — com teto de `size` e ordenação estável
      documentada no endpoint, para que a navegação não duplique nem perca itens.
    - **Taxonomia.** Categorias, tipos de material e licenças são listas controladas de
      referência (RF018, RN005, RN006): `slug` é a chave estável e `nome` é só rótulo de
      exibição, que pode mudar sem quebrar dados (ADR-0006). São ordenadas por `nome` —
      ordem de ponto de código (`COLLATE "C"` na consulta, ADR-0010), a mesma em qualquer
      máquina, e não a ordem da collation do banco — e
      filtráveis por estado ativo. Como listas de referência são curtas (13 categorias,
      6 tipos, 7 licenças no MVP), o cliente pode omitir `page` e `size` e sempre recebe
      `total` no envelope.

    Versionamento: mudança incompatível de caminho ou de payload sobe a versão menor
    deste documento e é registrada no card que a introduz. Migração de dados e
    alteração de taxonomia são migração Flyway nova, nunca edição de contrato publicada.

  contact:
    name: João Mateus de Sousa
    url: https://github.com/jmsousa07

servers:
  - url: http://localhost:8080/api
    description: ambiente local

tags:
  - name: sistema
    description: Estado operacional da API.
  - name: taxonomia
    description: Leitura da taxonomia de referência — categorias, tipos de material e licenças (RF018).
  - name: descoberta
    description: |-
      Descoberta pública, sem sessão: listar materiais, ver o detalhe de um material e o
      perfil público de um autor (RF002–RF007). Só material PUBLICADO de conta ATIVA.
  - name: identidade
    description: |-
      Cadastro, sessão e perfil próprio (RF008–RF011). Depois do cadastro o usuário já sai
      autenticado; a verificação de e-mail só é exigida para publicar (ADR-0003 (b)).
  - name: publicacao
    description: |-
      Publicação de material próprio e acesso ao arquivo publicado (RF012–RF014, RF019).
      Publicar exige sessão e conta `ATIVO` (ADR-0003 (b)); baixar o arquivo de material
      público não exige sessão.
  - name: gerenciamento
    description: |-
      Gerenciamento do material próprio (RF015–RF017, RF019; DRS §18 Etapa 5): listar e ler os
      materiais da conta da sessão em qualquer dos três estados, editar metadados, retirar ou
      repor no público e excluir. Toda a superfície exige sessão e vive em
      `/perfil/atual/materiais` — o material é do perfil da sessão (RN001) —, fora de
      `/materiais/{slug}` para não colidir com o slug público.

paths:
  /health:
    get:
      tags: [sistema]
      summary: Estado da API
      description: |
        Informa se a API está no ar e se o banco responde (RF022 — estados operacionais
        claros). Serve à operação e ao monitoramento; nenhum fluxo do visitante depende
        deste endpoint. A resposta é sempre 200 quando a API está no ar: se o banco não
        responde, o corpo traz `status: DEGRADED` e `database: DOWN`, e o detalhe técnico
        fica só no log do servidor (RNF012). API fora do ar não é resposta HTTP — é falha
        de conexão, que o monitor percebe pelo status 200 ausente. Um endpoint que
        sinalizasse degradação por 503 exigiria mudar a implementação; se o
        monitoramento passar a depender disso, isso é mudança de contrato primeiro
        (AGENTS.md regra 1), em card próprio.
      operationId: getHealth
      responses:
        '200':
          description: API no ar; `status` e `database` informam o alcance do banco.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoApi'
              examples:
                operante:
                  summary: API operante, banco no ar
                  value:
                    status: UP
                    version: 0.2.0
                    database: UP
                degradado:
                  summary: API no ar, banco fora
                  value:
                    status: DEGRADED
                    version: 0.2.0
                    database: DOWN
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'

  /categorias:
    get:
      tags: [taxonomia]
      summary: Lista as categorias científicas
      description: |
        Devolve as categorias de referência para popular filtros de busca e o formulário
        de publicação (RF018, RN005). Filtro por estado ativo: sem o parâmetro, devolve
        apenas categorias ativas; com `ativo=false`, devolve também as desativadas.
        Ordenação estável por `nome` (ordem definida pelo servidor: ponto de código,
        `COLLATE "C"` — ADR-0010 —, igual em qualquer collation do banco), para que a navegação
        entre páginas não repita nem perca itens. `slug` é a chave estável; o cliente
        guarda e envia o `slug`, nunca o `nome`.
      operationId: listCategorias
      parameters:
        - $ref: '#/components/parameters/FiltroAtivo'
        - $ref: '#/components/parameters/NumeroPagina'
        - $ref: '#/components/parameters/TamanhoPagina'
      responses:
        '200':
          description: Página de categorias, ordenada por nome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaCategorias'
              examples:
                primeiraPagina:
                  summary: Categorias ativas, primeira página
                  value:
                    items:
                      - id: 3f2c1a90-5b7e-4c21-9a11-8e0d2f6b7c44
                        slug: computacao-e-tecnologia
                        nome: Computação e Tecnologia
                        descricao: Software, dados, redes, inteligência artificial e demais áreas da computação.
                        ativo: true
                      - id: 8b1d4e77-0c93-4a52-b6d0-1f7e5a9c2d18
                        slug: matematica-e-estatistica
                        nome: Matemática e Estatística
                        descricao: Álgebra, cálculo, geometria, probabilidade e estatística.
                        ativo: true
                    page: 0
                    size: 20
                    total: 13
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'
        '500':
          $ref: '#/components/responses/ErroInesperado'

  /tipos-material:
    get:
      tags: [taxonomia]
      summary: Lista os tipos de material
      description: |
        Devolve os tipos de material de referência usados no filtro e no formulário de
        publicação (RF018). Filtro por estado ativo: sem o parâmetro, devolve apenas
        tipos ativos; com `ativo=false`, devolve também os desativados. Ordenação estável
        por `nome`. `slug` é a chave estável (ADR-0006).
      operationId: listTiposMaterial
      parameters:
        - $ref: '#/components/parameters/FiltroAtivo'
        - $ref: '#/components/parameters/NumeroPagina'
        - $ref: '#/components/parameters/TamanhoPagina'
      responses:
        '200':
          description: Página de tipos de material, ordenada por nome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaTiposMaterial'
              examples:
                primeiraPagina:
                  summary: Tipos de material ativos
                  value:
                    items:
                      - id: 1c9e5a30-7d24-4f61-8b02-2a6f1d3e9c05
                        slug: nota-de-aula
                        nome: Nota de aula
                        ativo: true
                      - id: 5d0b2f18-9a63-4c77-8e14-6b3c7f204a91
                        slug: slides
                        nome: Slides
                        ativo: true
                    page: 0
                    size: 20
                    total: 6
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '405':
          $ref: '#/components/responses/ErroMetodoNaoPermitido'
        '500':
          $ref: '#/components/responses/ErroInesperado'

  /licencas:
    get:
      tags: [taxonomia]
      summary: Lista as licenças de reutilização
      description: |
        Devolve as licenças de referência disponíveis para o autor escolher na publicação
        (RF018, RN006). Filtro por estado ativo: sem o parâmetro, devolve apenas licenças
        ativas; com `ativo=false`, devolve também as desativadas. Ordenação estável por
        `nome`. Cada item traz `descricaoCurta`, em linguagem simples, do que a licença
        permite — a licença nunca é decorativa nem sugere que estar público significa
        domínio público (RN006, §13.2). `identificador` e `urlReferencia` podem vir
        ausentes quando a licença não tem identificador nem URL públicos (caso de "Todos
        os direitos reservados").
      operationId: listLicencas
      parameters:
        - $ref: '#/components/parameters/FiltroAtivo'
        - $ref: '#/components/parameters/NumeroPagina'
        - $ref: '#/components/parameters/TamanhoPagina'
      responses:
        '200':
          description: Página de licenças, ordenada por nome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaLicencas'
              examples:
                primeiraPagina:
