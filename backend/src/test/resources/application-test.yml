# Datasource da SUÍTE DE TESTES (card E1.5).
#
# Este arquivo é a fonte ÚNICA do banco de teste. O alvo `make test` NÃO carrega o `.env`
# de propósito: a evidência precisa ser reproduzível de um shell limpo (`env -i ... make
# test`) e não depender de estado invisível do ambiente de quem rodou (§17.2, §17.5,
# ADR-0004 ajustes 4 e 5).
#
# Banco: `scipath_test` — nunca o banco de desenvolvimento `scipath`. O critério de aceite
# do card exige que o teste de integração rode contra o banco de teste.
#
# Autenticação SEM segredo no repositório (RNF012): a role `scipath_test` não tem senha e
# entra por `trust` no pg_hba, restrito ao banco `scipath_test`, à role `scipath_test` e ao
# loopback (127.0.0.1/::1). Por isso `password` é vazio: não há nada a esconder — não existe
# senha. A provisão é feita por `infra/db-test-setup.sh` (ver também infra/README.md).
#
# Se este arquivo não existisse, o perfil `test` herdaria `spring.datasource.url` vazio de
# application.yml e o contexto Spring não subiria ("Failed to determine a suitable driver
# class") — era exatamente o defeito que o card E1.5 fecha.
spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/scipath_test
    username: scipath_test
    password: ""
    hikari:
      # A máquina tem 954 MB (AGENTS.md). O perfil base usa timeouts curtos (2 s) para o
      # /health responder rápido com o banco fora; sob pressão de memória isso produz
      # "Connection is not available" falso e reprova teste que não é de schema. A suíte
      # espera mais. `initialization-fail-timeout` positivo faz o pool FALHAR na subida se
      # o banco não existir — é o que garante que o teste de integração não passe vazio.
      initialization-fail-timeout: 60000
      connection-timeout: 60000
      validation-timeout: 5000

# Prazos de sessão no perfil de TESTE (card E3.3). São curtos de propósito: a expiração
# por inatividade é um prazo de relógio real, e o card exige um teste que a provoque. Com
# 12 h isso exigiria esperar 12 h ou mexer no relógio da JVM; com 5 s o teste espera o
# prazo configurado e observa a recusa — a MESMA regra de produção, com outro número.
# `duracao-absoluta` (30 s) é maior que a inatividade para que o teste de inatividade não
# seja, na verdade, um teste do limite absoluto.
scipath:
  sessao:
    duracao-inatividade: 5s
    duracao-absoluta: 30s

  # Outbox do canal de e-mail no perfil de TESTE (card E3.4). O diretório é relativo ao
  # `backend/` (o fork do surefire roda com o cwd do módulo) e cai em `target/`, que já é
  # ignorado pelo git: a suíte nunca escreve no outbox de quem desenvolve, e a evidência lê o
  # arquivo daqui para pegar o token que o cadastro gerou — sem implementação de teste
  # substituindo o canal (um segundo contexto Spring custaria memória numa máquina de 954 MB,
  # AGENTS.md).
  #
  # Os prazos de `scipath.token.*` NÃO são encurtados aqui de propósito: expiração e cooldown
  # são provocados envelhecendo a linha em `verification_token` (o mesmo recurso que o E3.3 usou
  # para o limite absoluto da sessão). Assim o teste prova a MESMA regra de produção, com os
  # mesmos números, e a suíte não espera 24 h nem 60 s — e não há config especial que possa
  # mascarar um defeito de cálculo de prazo.
  email:
    outbox:
      diretorio: target/outbox-de-teste

  # Recebimento do arquivo enviado no perfil de TESTE (card E4.2). Nada aqui é implementação
  # de teste: são os MESMOS valores que produção lê, com outros números — de propósito.
  #
  # `max-bytes: 1MB` em vez dos 30 MB do ADR-0005 §1 é o que dá conteúdo ao critério "nenhum
  # valor de limite literal no código": a MESMA linha de código recusa 1 MB nesta suíte e aceita
  # em produção, e a mensagem do 413 nomeia o valor configurado ("O arquivo excede o limite de
  # 1 MB."). Um limite cravado no código não passaria neste teste; um limite lido da configuração
  # passa — e é o mesmo caminho que o operador usa para trocar o valor pelo .env.
  #
  # O diretório cai em `target/` (relativo ao `backend/`, cwd do fork do surefire), como o
  # outbox do E3.4: a suíte nunca escreve na área de quem desenvolve, e `target/` já é ignorado
  # pelo git.
  upload:
    max-bytes: 1MB
    diretorio-temporario: target/upload-temporario-de-teste
