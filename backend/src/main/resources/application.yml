# Configuração da API. Nenhum segredo aqui: banco, usuário e senha vêm do .env
# (ver infra/db-setup.sh), exportado pelo Makefile como SPRING_DATASOURCE_*.
#
# Perfis (ADR-0004, ajuste 3): 'dev' e 'test' toleram falha de migração na subida
# (útil com o Postgres fora); qualquer outro perfil — em especial 'prod' — falha
# rápido se a migração falhar, para não servir com schema desatualizado em silêncio.
# Por isso NÃO há perfil padrão aqui: sem perfil explícito o comportamento é o
# seguro (fail-fast). Local: SPRING_PROFILES_ACTIVE=dev (o Makefile já faz isso em
# `make api:dev`).
spring:
  application:
    name: scipath-backend
  datasource:
    # Sem valor padrão embutido: se o .env não estiver carregado, a URL fica vazia
    # e /health reporta database=DOWN em vez de a API inventar um destino de banco.
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      # Banco é opcional na subida: com o Postgres fora, a API sobe e responde
      # database=DOWN em vez de derrubar o processo (critério 4 do card F0.1).
      initialization-fail-timeout: -1
      connection-timeout: 2000
      validation-timeout: 1000
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

scipath:
  # Preenchido pelo Maven (filtragem de recursos do spring-boot-starter-parent).
  version: '@project.version@'
  # Prazos da sessão (ADR-0003 (e), contrato v0.4). Os dois são aplicados no servidor a cada
  # requisição autenticada; `duracao-absoluta` é também o `Max-Age` da cookie, porque é o
  # único dos dois que não se estende. O perfil `test` encurta os dois para a expiração caber
  # em segundos (src/test/resources/application-test.yml).
  sessao:
    duracao-inatividade: 12h
    duracao-absoluta: 7d

  # Canal de e-mail (ADR-0003 (f)). Não há servidor SMTP nesta máquina e não há Docker para um
  # mail-catcher: em desenvolvimento, o `EmailSender` grava a mensagem num OUTBOX local e
  # `make email:outbox` mostra o último item — é o que torna verificação e recuperação
  # verificáveis sem e-mail de verdade. O diretório fica FORA do repositório (nada de mensagem
  # de desenvolvimento no `git status`); SCIPATH_OUTBOX_DIR aponta para outro lugar.
  email:
    outbox:
      diretorio: ${SCIPATH_OUTBOX_DIR:${user.home}/.scipath/outbox}
    link:
      # Página do FRONTEND que recebe o token. O token vai no FRAGMENTO (`#token=`), e não na
      # query string, porque fragmento não é enviado ao servidor: não entra em log de acesso
      # nem em `Referer` (RNF009) — a página lê `location.hash` e manda o token no CORPO da
      # confirmação, como o contrato exige. As rotas são das telas (E3.6/E3.7); com o endereço
      # em configuração, ajustá-las não exige mexer no backend.
      confirmacao-email: ${SCIPATH_LINK_CONFIRMACAO:http://localhost:3000/verificar-email#token={token}}
      recuperacao-senha: ${SCIPATH_LINK_RECUPERACAO:http://localhost:3000/recuperar-senha#token={token}}

  # Token de uso único (ADR-0003 (c) e (d)). As validades e o cooldown são aplicados no
  # servidor a partir das colunas `criado_em` e `expira_em` da `verification_token`.
  token:
    validade-confirmacao-email: 24h
    validade-recuperacao-senha: 30m
    cooldown-reenvio: 60s

  # Recebimento do arquivo enviado (card E4.2, RF013, ADR-0005 §1 e §2).
  upload:
    # O LIMITE de upload, num só lugar. O ADR-0005 §1 fixou 30 MB no MVP e exigiu que trocá-lo
    # fosse uma linha de .env, não um card: este é o único ponto onde o número aparece. Os dois
    # limites de multipart do servlet (arquivo e requisição) são CALCULADOS a partir dele em
    # ConfiguracaoDeUpload — por isso `spring.servlet.multipart.*` não é lido: ter o mesmo
    # limite em dois lugares é como ele passa a divergir sem ninguém notar.
    # Aceita a forma legível ("30MB") ou o número puro em bytes.
    max-bytes: ${SCIPATH_UPLOAD_MAX_BYTES:30MB}
    # Área temporária de recebimento: onde o arquivo fica entre ser validado (E4.2) e ser movido
    # para o storage definitivo (E4.3). Fora do repositório por padrão — como o outbox de e-mail
    # (E3.4) — e, por construção, fora de qualquer diretório servido: nada em `resources/static`
    # ou `frontend/public` alcança este caminho (RF013, RN008, §14.4).
    diretorio-temporario: ${SCIPATH_UPLOAD_DIR_TEMPORARIO:${user.home}/.scipath/upload-temporario}

  # Armazenamento definitivo do arquivo publicado (card E4.3, ADR-0005 §2, RF014).
  # É o destino do passo 2 da ordem do RN008: onde mora o arquivo que já passou por validação e que
  # o material publicado referencia. Diretório SEPARADO da área temporária de recebimento de
  # propósito — o coletor de órfãos (E4.5) precisa distinguir o que ainda não virou material do que
  # já virou.
  #
  # FORA do repositório por padrão, como o outbox de e-mail (E3.4) e a área temporária (E4.2), e
  # FORA de qualquer raiz servida: o arquivo é entregue por `GET /materiais/{slug}/arquivo`, que
  # decide visibilidade e autorização no servidor — endereço direto venceria a regra (RF014,
  # RNF014, §14.4). O valor é CONFERIDO na subida: diretório sob raiz servida ou vazio é recusado
  # com o motivo no erro (PropriedadesDeArmazenamento), em vez de virar vazamento silencioso.
  storage:
    diretorio: ${SCIPATH_STORAGE_DIR:${user.home}/.scipath/arquivos}
