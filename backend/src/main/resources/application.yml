# Configuração da API. Nenhum segredo aqui: banco, usuário e senha vêm do .env
# (ver infra/db-setup.sh), exportado pelo Makefile como SPRING_DATASOURCE_*.
#
# Perfis (ADR-0004, ajuste 3): 'dev' e 'test' toleram falha de migração na subida
# (útil com o Postgres fora); qualquer outro perfil — em especial 'prod' — falha
# rápido se a migração falhar, para não servir com schema desatualizado em silêncio.
# Por isso NÃO há perfil padrão aqui: sem perfil explícito o comportamento é o
# seguro (fail-fast). Local: SPRING_PROFILES_ACTIVE=dev (o Makefile já faz isso em
# `make api:dev`).
spring:
  application:
    name: scipath-backend
  datasource:
    # Sem valor padrão embutido: se o .env não estiver carregado, a URL fica vazia
    # e /health reporta database=DOWN em vez de a API inventar um destino de banco.
    url: ${SPRING_DATASOURCE_URL:}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      # Banco é opcional na subida: com o Postgres fora, a API sobe e responde
      # database=DOWN em vez de derrubar o processo (critério 4 do card F0.1).
      initialization-fail-timeout: -1
      connection-timeout: 2000
      validation-timeout: 1000
  flyway:
    locations: classpath:db/migration

server:
  port: 8080

scipath:
  # Preenchido pelo Maven (filtragem de recursos do spring-boot-starter-parent).
  version: '@project.version@'
  # Prazos da sessão (ADR-0003 (e), contrato v0.4). Os dois são aplicados no servidor a cada
  # requisição autenticada; `duracao-absoluta` é também o `Max-Age` da cookie, porque é o
  # único dos dois que não se estende. O perfil `test` encurta os dois para a expiração caber
  # em segundos (src/test/resources/application-test.yml).
  sessao:
    duracao-inatividade: 12h
    duracao-absoluta: 7d
